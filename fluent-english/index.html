<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<title>유창한 영어회화 1 · 목차 훈련</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="유창한 영어1">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 홈 / 목차 ============ -->
  <section class="screen" id="screen-home">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <img src="./assets/icon-192.png" alt="" width="46" height="46" decoding="async">
        </span>
        <div class="brand-text">
          <h1>유창한 영어회화 1</h1>
          <p class="sub">《유창한 영어회화를 꼭 원하는 분 1》 강성구</p>
        </div>
      </div>
      <div class="ring" id="ring" aria-label="전체 학습 진도">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
          <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="18"></circle>
        </svg>
        <span class="ring-num" id="ringNum">0%</span>
      </div>
    </header>

    <div class="statbar" id="statbar"></div>

    <button class="resume hidden" id="resumeBtn"></button>

    <div class="searchwrap">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off"
             placeholder="장 제목·문장 찾기 (예: HAVE)">
      <button class="search-clear hidden" id="searchClear" aria-label="검색어 지우기">✕</button>
    </div>

    <nav class="chips" id="partChips" aria-label="PART 선택"></nav>

    <div class="list-summary" id="listSummary"></div>
    <div class="chapter-list" id="chapterList"></div>
    <footer class="foot">
      <p>📖 교재 원문 = 사진으로 확인한 실제 본문 · ✨ 교재 방식 = 목차 제목에 책의 훈련 공식을 적용해 구성</p>
    </footer>
  </section>

  <!-- ============ 장(챕터) ============ -->
  <section class="screen hidden" id="screen-chapter">
    <header class="chbar">
      <button class="icon-btn" id="backBtn" aria-label="목차로 돌아가기">←</button>
      <div class="chbar-title" id="chbarTitle"></div>
      <button class="icon-btn star" id="starBtn" aria-label="즐겨찾기">☆</button>
    </header>

    <main class="chbody" id="chbody">
      <div class="ch-head">
        <div class="ch-kicker" id="chKicker"></div>
        <h2 id="chTitle"></h2>
        <div class="ch-meta" id="chMeta"></div>
      </div>

      <details class="lecture" id="lectureBox">
        <summary><span>📖 핵심 강의 &amp; 발음 팁</span><span class="chev" aria-hidden="true">⌄</span></summary>
        <div class="lecture-body" id="lectureBody"></div>
      </details>

      <nav class="modes" id="modeTabs" aria-label="훈련 모드"></nav>
      <div id="modePanel"></div>
    </main>

    <div class="bottombar">
      <button class="done-btn" id="doneBtn"></button>
    </div>
  </section>

</div>
<script src="assets/data/parts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
