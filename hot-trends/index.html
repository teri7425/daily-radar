<style>
:root{
  --bg:#0c0806; --bg2:#130d0a; --card:#1a1210; --card2:#241711;
  --line:#33211a; --line2:#472d22;
  --tx:#fbf1ea; --tx2:#c9ada0; --tx3:#977b6d;
  --accent:#ff7a3d; --accent-d:#c0461a; --flame:#ffb547;
  --pink:#ff5c8a; --teal:#4fd1c5; --gold:#ffc23d;
  --ok:#45d99b; --warn:#f2b134;
  --shadow:0 8px 26px rgba(0,0,0,.42); --r:16px;
  --tabh:52px;
}
html[data-theme="light"]{
  --bg:#fdf7f3; --bg2:#f8efe9; --card:#ffffff; --card2:#fbf1ea;
  --line:#efe0d6; --line2:#e0cabd;
  --tx:#221410; --tx2:#6b4f43; --tx3:#94786a;
  --accent:#cf4a14; --accent-d:#9d360b; --flame:#b87400;
  --pink:#c62b5c; --teal:#0d7c73; --gold:#9a6a00;
  --ok:#0d8a5f; --warn:#a86b00;
  --shadow:0 4px 18px rgba(60,30,15,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
body{
  background:
    radial-gradient(900px 420px at 8% -6%, rgba(255,122,61,.16), transparent 62%),
    radial-gradient(760px 400px at 96% 0%, rgba(255,92,138,.10), transparent 60%),
    var(--bg);
  color:var(--tx);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-0.012em;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
html[data-theme="light"] body{background:var(--bg)}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 8px;width:100%}

/* topbar */
.topbar{position:sticky;top:0;z-index:60;background:var(--bg);
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:760px;margin:0 auto;padding:8px 14px 7px;display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(145deg,#5a1a0c,#b83b12);box-shadow:0 4px 14px rgba(255,122,61,.30)}
.brandtxt{min-width:0;flex:1}
.brandtxt b{display:block;font-size:14.5px;font-weight:850;line-height:1.2;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt span{display:block;font-size:10.5px;color:var(--tx3);font-weight:700}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);
  font-size:14px;display:grid;place-items:center;padding:0;cursor:pointer;transition:.15s}
.iconbtn:active{transform:scale(.92)}

/* tabs */
.tabbar{position:sticky;top:calc(46px + env(safe-area-inset-top));z-index:59;
  background:color-mix(in srgb, var(--bg) 95%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.tabbar-in{max-width:760px;margin:0 auto;display:flex;gap:6px;padding:7px 12px 8px}
.tab{flex:1 1 0;min-width:0;border:1px solid var(--line2);background:var(--card);color:var(--tx2);
  border-radius:11px;padding:8px 4px;font-size:12.5px;font-weight:800;letter-spacing:-.02em;cursor:pointer;
  transition:.16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:linear-gradient(150deg,var(--accent),var(--accent-d));border-color:transparent;color:#1d0a02;
  box-shadow:0 4px 14px rgba(255,122,61,.30)}
html[data-theme="light"] .tab[aria-selected="true"]{color:#fff}

/* hero */
.hero{padding:15px 0 4px}
.date{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--accent);
  background:color-mix(in srgb, var(--accent) 13%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  padding:3px 9px;border-radius:8px;letter-spacing:.01em}
h1{margin:10px 0 7px;font-size:23px;line-height:1.28;font-weight:900;letter-spacing:-.035em}
h1 .em{margin-right:6px}
.keywords{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 11px}
.kw{font-size:11.5px;font-weight:750;color:var(--flame);background:color-mix(in srgb, var(--flame) 13%, transparent);
  border:1px solid color-mix(in srgb, var(--flame) 30%, transparent);padding:3px 8px;border-radius:8px}
.oneline{border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;
  padding:11px 13px;font-size:14.5px;font-weight:650;line-height:1.62;color:var(--tx)}
.oneline b{color:var(--accent);font-weight:850}
.oneline .sub{display:block;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--tx3);line-height:1.6}
.sigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:11px 0 2px}
.sig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 9px;min-width:0}
.sig b{display:block;font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--accent);line-height:1.25;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig span{display:block;font-size:10.5px;font-weight:700;color:var(--tx3);line-height:1.4;margin-top:2px}

/* pane & section head */
.pane{display:none}
.pane.active{display:block}
.sechead{margin:20px 0 9px;display:flex;align-items:flex-start;gap:9px}
.sechead .ico{width:31px;height:31px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;
  background:var(--card2);border:1px solid var(--line)}
.sechead .tt{min-width:0;flex:1}
.sechead h2{margin:0;font-size:16.5px;font-weight:860;letter-spacing:-.03em;line-height:1.35}
.sechead .desc{font-size:11.5px;color:var(--tx3);font-weight:650;margin-top:1px;line-height:1.5}

/* product cards */
.pcard{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 12px 11px;margin-bottom:9px}
.rank{flex:0 0 26px;height:26px;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:900;letter-spacing:-.02em;

  $('#verifyBody').innerHTML =
      '<h4>수집 범위와 한계</h4><ul>'+v.scope.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ul>'
    + '<h4>수치 충돌</h4>'+v.conflicts.map(function(c){
        return '<div class="conf"><b>'+esc(c.item)+'</b><span><i>'+esc(c.a)+'</i> ↔ <i>'+esc(c.b)+'</i> · '+esc(c.note)+'</span></div>';
      }).join('')
    + '<h4>사실 확인 상태</h4>'+v.status.map(function(s){
        return '<div class="conf"><b><span class="badge '+s.c+'">'+esc(s.k)+'</span></b><span>'+esc(s.v)+'</span></div>';
      }).join('')
    + '<h4>출처</h4>'+v.sources.map(function(g){
        return '<div class="conf"><b>'+esc(g.g)+'</b><div class="srclist">'
          + g.links.map(function(l){ return '<a href="'+l.u+'" target="_blank" rel="noopener">'+esc(l.l)+' ↗</a>'; }).join('')
          + '</div></div>';
      }).join('')
    + '<h4>이 화면의 범위</h4><ul><li>'+m.note+'</li>'
    + '<li>이 화면은 <b>'+esc(m.mode)+'</b>입니다. 08:00 정기 실행에서는 <code>DATA</code> 객체만 갱신하면 됩니다.</li></ul>';

  $('#footMeta').innerHTML = esc(m.date)+' '+esc(m.asof)+' 작성 · '+esc(m.version)+' · 모든 수치는 위 출처에서 확인 가능합니다.';

  // tabs
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panes = { products: $('#pane-products'), behavior: $('#pane-behavior'), ideas: $('#pane-ideas') };
  function selectTab(name, scroll){
    tabs.forEach(function(t){ t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === name)); });
    Object.keys(panes).forEach(function(k){ panes[k].classList.toggle('active', k === name); });
    if(scroll){
      var head = panes[name].querySelector('.sechead');
      if(head){
        var y = head.getBoundingClientRect().top + window.scrollY - 108;
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      }
    }
  }
  tabs.forEach(function(t){
    t.addEventListener('click', function(){ selectTab(t.getAttribute('data-tab'), true); });
  });

  // theme
  var root = document.documentElement, btn = $('#themeBtn');
  try{ var saved = localStorage.getItem('ht-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
  function paint(){
    var light = root.getAttribute('data-theme') === 'light';
    btn.textContent = light ? '🌙' : '☀️';
    var tc = document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', light ? '#fdf7f3' : '#0c0806');
  }
  paint();
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('ht-theme', next); }catch(e){}
    paint();
  });

  // checklist persistence
  try{
    var st = JSON.parse(localStorage.getItem('ht-check') || '{}');
    Object.keys(st).forEach(function(k){
      var el = document.getElementById(k);
      if(el && st[k]) el.checked = true;
    });
  }catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('.check input'), function(el){
    el.addEventListener('change', function(){
      try{
        var st = JSON.parse(localStorage.getItem('ht-check') || '{}');
        st[el.id] = el.checked;
        localStorage.setItem('ht-check', JSON.stringify(st));
      }catch(e){}
    });
  });
})();
</script>
</body>
</html>
