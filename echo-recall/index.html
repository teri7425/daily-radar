<style>
/* ================= tokens ================= */
:root{
  --bg:#070b14; --bg2:#0b1220; --card:#0f1a2c; --card2:#152238; --card3:#1a2a44;
  --line:#1e2d45; --line2:#2b3f5f;
  --tx:#e8eff9; --tx2:#9aabc4; --tx3:#6b7f9e;
  --accent:#4ad9c0; --accent-d:#12a08c; --violet:#a78bfa; --amber:#f7b955; --bad:#ff7183;
  --tc:#4ad9c0; --tc-d:#12a08c;
  --shadow:0 8px 28px rgba(0,0,0,.36);
  --r:18px;
}
html[data-theme="light"]{
  --bg:#eef2f9; --bg2:#f8fafd; --card:#ffffff; --card2:#f2f6fc; --card3:#e9f0fa;
  --line:#dde6f2; --line2:#c9d7e8;
  --tx:#0b1626; --tx2:#4f6382; --tx3:#7c8ea8;
  --accent:#0a8f7e; --accent-d:#06725f; --violet:#6047d6; --amber:#a87200; --bad:#c62b3c;
  --shadow:0 6px 20px rgba(16,32,56,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 460px at 8% -10%, rgba(74,217,192,.10), transparent 62%),
    radial-gradient(760px 420px at 96% -4%, rgba(167,139,250,.12), transparent 60%),
    var(--bg);
  color:var(--tx);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15.5px; line-height:1.62; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(34px + env(safe-area-inset-bottom));
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 30px}
button{font-family:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;letter-spacing:-0.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= top bar ================= */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--bg);
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{max-width:820px;margin:0 auto;padding:9px 14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(145deg,#4ad9c0,#a78bfa);box-shadow:0 4px 14px rgba(74,217,192,.3);
}
.brand>.binfo{min-width:0;flex:1}
.brand h1{font-size:15.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:10.5px;font-weight:600;color:var(--tx3);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:16px;display:grid;place-items:center;cursor:pointer;transition:.15s;padding:0;
}
.iconbtn:active{transform:scale(.93)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:6px 8px;min-width:0;text-align:center;
}
.stat b{display:block;font-size:15px;font-weight:800;line-height:1.25;color:var(--tc);letter-spacing:-0.02em}
.stat span{display:block;font-size:9.5px;font-weight:700;color:var(--tx3);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* track tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}
.ttab{
  min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  font-size:11.5px;font-weight:800;padding:8px 3px;border-radius:11px;cursor:pointer;
  white-space:nowrap;transition:.15s;letter-spacing:-0.02em;
}
.ttab .em{font-size:13px;line-height:1}
.ttab .lb{overflow:hidden;text-overflow:ellipsis}
.ttab .en{display:none}
.ttab[aria-selected="true"]{color:#04140f;border-color:transparent;box-shadow:0 4px 14px rgba(74,217,192,.22)}
.ttab[data-track="daily"][aria-selected="true"]{background:linear-gradient(140deg,#4ad9c0,#12a08c)}
.ttab[data-track="travel"][aria-selected="true"]{background:linear-gradient(140deg,#f7b955,#d98c14)}
.ttab[data-track="business"][aria-selected="true"]{background:linear-gradient(140deg,#b79cff,#7c5cf0);color:#0d0424}
html[data-theme="light"] .ttab[aria-selected="true"]{color:#fff}

/* mode tabs */
.mtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px;background:var(--card2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.mtab{
  min-width:0;border:0;background:transparent;color:var(--tx2);font-size:11.5px;font-weight:800;
  padding:7px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;letter-spacing:-0.02em;transition:.15s;
}
.mtab[aria-selected="true"]{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.18);border:1px solid var(--line2)}
.mtab .lb{overflow:hidden;text-overflow:ellipsis}

/* ================= panels ================= */
.panel{display:none}
.panel.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.cue{
  display:flex;align-items:center;gap:8px;margin:12px 0 10px;
  font-size:11.5px;font-weight:700;color:var(--tx2);flex-wrap:wrap;
}
.cue .dot{width:7px;height:7px;border-radius:50%;background:var(--tc);flex:0 0 auto;box-shadow:0 0 8px var(--tc)}
.cue .sep{color:var(--tx3);opacity:.6}
.cue b{color:var(--tx)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.card+.card{margin-top:12px}
.pad{padding:13px 14px}

/* scene */
.scene{position:relative;width:100%;aspect-ratio:16/9;background:#0a1220;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.scene .sceneTag{
  position:absolute;left:10px;top:10px;font-size:10px;font-weight:800;letter-spacing:.02em;
  color:#eaf6ff;background:rgba(6,12,22,.62);border:1px solid rgba(255,255,255,.16);
  padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}

/* meta chips */
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chip{
  font-size:10.5px;font-weight:800;color:var(--tx2);background:var(--card2);
  border:1px solid var(--line);padding:3px 8px;border-radius:999px;letter-spacing:-0.01em;
}
.chip.tc{color:var(--tc);border-color:color-mix(in srgb, var(--tc) 40%, transparent);background:color-mix(in srgb, var(--tc) 12%, transparent)}
.chip.due{color:var(--amber);border-color:color-mix(in srgb, var(--amber) 40%, transparent);background:color-mix(in srgb, var(--amber) 12%, transparent)}

.steps{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin:0 0 10px;font-size:9.5px;font-weight:900;letter-spacing:-0.01em}
.steps .stp{color:var(--tx3);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.steps .stp.on{color:#04140f;background:var(--tc);border-color:transparent}
.steps .stp.done{color:var(--tc);border-color:color-mix(in srgb, var(--tc) 40%, transparent)}
html[data-theme="light"] .steps .stp.on{color:#fff}
.steps .ar{color:var(--tx3);font-size:9px;opacity:.6}
.ko-sit{margin:0 0 7px;font-size:12.5px;color:var(--tx3);font-weight:600}
.ko-target{margin:0 0 12px;font-size:16.5px;font-weight:800;line-height:1.5;letter-spacing:-0.02em}
.tg{display:inline-block;font-size:10px;font-weight:900;letter-spacing:0;color:#04140f;background:var(--tc);
  border-radius:5px;padding:2px 7px;margin-right:7px;vertical-align:3px}
html[data-theme="light"] .tg{color:#fff}

.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.tool{
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line2);background:var(--card2);color:var(--tx2);
  font-size:12px;font-weight:800;padding:10px 6px;border-radius:11px;cursor:pointer;transition:.15s;
  white-space:nowrap;
}
.tool:active{transform:scale(.975)}
.tool[aria-pressed="true"]{color:#06120f;background:linear-gradient(140deg,var(--tc),var(--tc-d));border-color:transparent}
html[data-theme="light"] .tool[aria-pressed="true"]{color:#fff}

/* 3s challenge */
.chal{display:none;margin:0 0 11px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.chal.on{display:block}
.chal .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:var(--tx2);margin-bottom:7px}
.chal .row b{color:var(--tc)}
.chal .bar{height:8px;border-radius:999px;background:var(--card3);overflow:hidden;border:1px solid var(--line)}
.chal .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--tc),var(--blue,#7cc7ff))}
.chal.on .bar i{animation:chal3 3s linear forwards}
@keyframes chal3{from{width:0}to{width:100%}}
.chal.done .bar i{background:linear-gradient(90deg,var(--amber),#ff9d5c)}

.hintbox{display:none;margin:0 0 11px;border-left:3px solid var(--amber);background:color-mix(in srgb, var(--amber) 10%, transparent);border-radius:0 10px 10px 0;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--tx)}
.hintbox.on{display:block}
.hintbox .k{display:block;font-size:10px;font-weight:800;color:var(--amber);letter-spacing:.06em;margin-bottom:2px}

.btn-primary{
  width:100%;border:0;cursor:pointer;border-radius:13px;padding:14px 12px;
  font-size:14.5px;font-weight:900;letter-spacing:-0.02em;color:#04140f;
  background:linear-gradient(140deg,var(--tc),var(--tc-d));
  box-shadow:0 6px 20px color-mix(in srgb, var(--tc) 32%, transparent);
  transition:.15s;
}
html[data-theme="light"] .btn-primary{color:#fff}
.btn-primary:active{transform:scale(.985)}
.btn-primary.small{padding:11px 12px;font-size:13px}

/* answer */
.answer{display:none;margin-top:14px;border-top:1px dashed var(--line2);padding-top:13px}
.answer.on{display:block;animation:fade .22s ease}
.en{
  font-size:19px;line-height:1.62;font-weight:700;letter-spacing:-0.015em;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0 0 8px;word-break:keep-all;
}
.en .chunk{background:linear-gradient(transparent 62%, color-mix(in srgb, var(--tc) 22%, transparent) 62%);border-radius:3px;padding:0 1px}
.en b{font-weight:900;color:var(--tc)}
.en .sl{color:var(--tx3);font-weight:400;margin:0 5px;opacity:.75}
.nuance{margin:0 0 11px;font-size:12.5px;line-height:1.65;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.nuance b{color:var(--tx);font-weight:800}

/* tts */
.ttsbar{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin-bottom:9px}
.ttshead{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-bottom:8px}
.roundbadge{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--tc);
  background:color-mix(in srgb, var(--tc) 12%, transparent);border:1px solid color-mix(in srgb, var(--tc) 34%, transparent);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}
.roundbadge.idle{color:var(--tx3);background:transparent;border-color:var(--line2)}
.roundbadge .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.ttsctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ttsctl button{
  border:1px solid var(--line2);background:var(--card);color:var(--tx);
  font-size:11.5px;font-weight:800;padding:9px 3px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.ttsctl button:active{transform:scale(.96)}
.ttsctl button.stop{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 40%, transparent)}
.ttsctl button:disabled{opacity:.45}
.voicerow{display:flex;align-items:center;gap:7px;margin-top:8px}
.voicerow label{font-size:10.5px;font-weight:800;color:var(--tx3);white-space:nowrap}
.voicerow select{
  flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--line2);
  border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:700;font-family:inherit;
}
.ttswarn{display:none;margin-top:8px;font-size:11px;font-weight:700;color:var(--amber);line-height:1.5}
.ttswarn.on{display:block}

/* accent selector (4종) */
.accbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 10px;margin:12px 0 0}
.acchead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.acchead .k{font-size:9.5px;font-weight:900;color:var(--tx3);letter-spacing:.06em;white-space:nowrap}
.acchead .cur{font-size:10.5px;font-weight:900;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",-apple-system,"Segoe UI",Roboto,sans-serif}
.accrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.acc{
  min-width:0;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0px;
  border:1px solid var(--line2);background:var(--card2);color:var(--tx2);border-radius:11px;
  padding:4px 2px;cursor:pointer;transition:.15s;
}
.acc .fl{font-size:15px;line-height:1.15;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.acc .nm{font-size:11.5px;font-weight:900;line-height:1.25;letter-spacing:-0.02em}
.acc .lc{font-size:8.5px;font-weight:800;color:var(--tx3);letter-spacing:0;line-height:1.3}
.acc[aria-pressed="true"]{border-color:color-mix(in srgb, var(--tc) 60%, transparent);background:color-mix(in srgb, var(--tc) 12%, transparent);color:var(--tx)}
.acc[aria-pressed="true"] .lc{color:var(--tc)}
.acc:active{transform:scale(.97)}
.accwarn{display:none;margin-top:7px;font-size:10.5px;font-weight:800;color:var(--amber);line-height:1.45}
.accwarn.on{display:block}

/* shadow cue */
.shadow{
  display:flex;gap:8px;align-items:flex-start;margin:0 0 12px;font-size:12px;font-weight:700;line-height:1.55;
  color:var(--tx2);background:color-mix(in srgb, var(--violet) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--violet) 28%, transparent);border-radius:11px;padding:8px 10px;
}
.shadow .em{font-size:14px;line-height:1.2}
.shadow b{color:var(--tx)}

/* srs */
.srshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.srshead .t{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.02em}
.srshead .n{font-size:10.5px;font-weight:800;color:var(--tx3)}
.srs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.srs button{
  border:1px solid var(--line2);border-radius:11px;background:var(--card2);color:var(--tx);
  padding:9px 2px;cursor:pointer;font-weight:800;transition:.15s;min-width:0;
}
.srs button:active{transform:scale(.96)}
.srs button .r{display:block;font-size:11.5px;line-height:1.25;font-weight:900;letter-spacing:-0.02em}
.srs button .i{display:block;font-size:10px;color:var(--tx3);font-weight:700;margin-top:2px}
.srs button[data-r="again"]{border-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.srs button[data-r="again"] .r{color:var(--bad)}
.srs button[data-r="hard"]{border-color:color-mix(in srgb, var(--amber) 45%, transparent)}
.srs button[data-r="hard"] .r{color:var(--amber)}
.srs button[data-r="good"]{border-color:color-mix(in srgb, var(--tc) 45%, transparent)}
.srs button[data-r="good"] .r{color:var(--tc)}
.srs button[data-r="easy"]{border-color:color-mix(in srgb, var(--violet) 45%, transparent)}
.srs button[data-r="easy"] .r{color:var(--violet)}
.srsdone{display:none;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--tc);text-align:center}
.srsdone.on{display:block}

/* progress bar */
.pwrap{margin:0 0 11px}
.pwrap .lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--tx3);margin-bottom:5px}
.pbar{height:7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .p-mastered{background:linear-gradient(90deg,var(--tc),var(--tc-d))}
.pbar .p-learning{background:color-mix(in srgb, var(--amber) 65%, transparent)}

/* ================= drill ================= */
.sec-h{display:flex;align-items:baseline;gap:7px;margin:2px 0 9px}
.sec-h h2{font-size:16px;font-weight:900}
.sec-h .s{font-size:11px;font-weight:700;color:var(--tx3)}
.patsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.pat{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:12px;padding:8px 9px;cursor:pointer;transition:.15s;min-width:0;
}
.pat[aria-pressed="true"]{border-color:color-mix(in srgb, var(--tc) 55%, transparent);background:color-mix(in srgb, var(--tc) 10%, transparent);color:var(--tx)}
.pat .k{display:block;font-size:11.5px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pat .e{display:block;font-size:10px;font-weight:700;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pat[aria-pressed="true"] .e{color:var(--tc)}

.pgroup{margin-bottom:10px}
.pgroup .gl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900;color:var(--tx3);letter-spacing:.03em;margin-bottom:5px}
.pgroup .gl .num{width:15px;height:15px;border-radius:5px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:var(--tx2)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line2);background:var(--card2);color:var(--tx2);
  font-size:11.5px;font-weight:800;padding:7px 10px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.pill[aria-pressed="true"]{background:linear-gradient(140deg,var(--tc),var(--tc-d));border-color:transparent;color:#04140f;box-shadow:0 3px 12px color-mix(in srgb, var(--tc) 30%, transparent)}
html[data-theme="light"] .pill[aria-pressed="true"]{color:#fff}

.outbox{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:14px;padding:13px 12px;margin-bottom:10px}
.out{
  font-size:18px;line-height:1.5;font-weight:800;letter-spacing:-0.015em;margin:0;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;word-break:keep-all;
}
.out .v{color:var(--tc);background:color-mix(in srgb, var(--tc) 16%, transparent);border-radius:4px;padding:0 2px}
.outko{margin:7px 0 0;font-size:11.5px;font-weight:700;color:var(--tx3);line-height:1.55}
.drillbtns{display:grid;grid-template-columns:1fr auto;gap:6px}
.drillbtns button{
  border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-size:12px;font-weight:900;
  padding:11px 10px;border-radius:11px;cursor:pointer;white-space:nowrap;
}
.drillbtns button.main{background:linear-gradient(140deg,var(--tc),var(--tc-d));border-color:transparent;color:#04140f}
html[data-theme="light"] .drillbtns button.main{color:#fff}
.pnote{margin-top:10px;font-size:11.5px;line-height:1.6;color:var(--tx2);border-left:2px solid var(--line2);padding-left:9px}

/* ================= project ================= */
.missel{display:grid;gap:6px;margin-bottom:12px}
.mis{
  display:flex;align-items:center;gap:9px;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:12px;padding:9px 11px;cursor:pointer;transition:.15s;
}
.mis[aria-pressed="true"]{border-color:color-mix(in srgb, var(--tc) 55%, transparent);background:color-mix(in srgb, var(--tc) 9%, transparent);color:var(--tx)}
.mis .ico{width:26px;height:26px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.mis .tx{min-width:0;flex:1}
.mis .tx b{display:block;font-size:12.5px;font-weight:900;line-height:1.3;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mis .tx span{display:block;font-size:10px;font-weight:700;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mis .st{font-size:10px;font-weight:900;color:var(--tc);white-space:nowrap}
.mis .st.off{color:var(--tx3)}

.misbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.misbox .mt{font-size:14px;font-weight:900;margin-bottom:3px}
.misbox .ms{font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:9px}
.mprog{display:flex;align-items:center;gap:7px}
.mprog .bar{flex:1;height:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tc),var(--tc-d));transition:width .3s}
.mprog span{font-size:10.5px;font-weight:900;color:var(--tx2);white-space:nowrap}

.turn{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-bottom:9px}
.turn .th{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--card2);border-bottom:1px solid var(--line)}
.turn .th .n{width:18px;height:18px;border-radius:6px;background:var(--tc);color:#04140f;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}
.turn .th .l{font-size:11px;font-weight:900;color:var(--tx2);letter-spacing:.01em}
.turn .tb{padding:10px 11px}
.partner{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px}
.partner .av{width:24px;height:24px;border-radius:8px;background:color-mix(in srgb, var(--violet) 22%, transparent);border:1px solid color-mix(in srgb, var(--violet) 40%, transparent);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.partner .tx{min-width:0;flex:1}
.partner .who{font-size:9.5px;font-weight:900;color:var(--violet);letter-spacing:.04em;margin-bottom:1px}
.partner .en{font-size:13.5px;font-weight:700;line-height:1.45;margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.partner button{
  border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:9px;
  font-size:10px;font-weight:900;padding:6px 8px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
}
.userq{background:color-mix(in srgb, var(--tc) 8%, transparent);border:1px solid color-mix(in srgb, var(--tc) 26%, transparent);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.userq .who{font-size:9.5px;font-weight:900;color:var(--tc);letter-spacing:.04em;margin-bottom:2px}
.userq .ko{font-size:12.5px;font-weight:800;line-height:1.5}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tbtns button{border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-size:11px;font-weight:900;padding:9px 4px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tbtns button.main{background:linear-gradient(140deg,var(--tc),var(--tc-d));border-color:transparent;color:#04140f}
html[data-theme="light"] .tbtns button.main{color:#fff}
.model{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)}
.model.on{display:block;animation:fade .2s ease}
.model .en{font-size:14.5px;margin:0 0 5px}
.model .nk{font-size:11px;color:var(--tx3);font-weight:700;margin:0}
.turn .done{display:flex;align-items:center;gap:7px;padding:7px 11px;border-top:1px solid var(--line);font-size:11px;font-weight:800;color:var(--tx2);cursor:pointer}
.turn .done input{width:16px;height:16px;accent-color:var(--tc);margin:0}
.turn.completed{border-color:color-mix(in srgb, var(--tc) 42%, transparent)}

.foot{margin:18px 0 0;padding-top:13px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.7;color:var(--tx3);font-weight:600}
.foot .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.foot button{background:transparent;border:1px solid var(--line);color:var(--tx3);font-size:10.5px;font-weight:800;padding:6px 10px;border-radius:9px;cursor:pointer}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--card3);color:var(--tx);border:1px solid var(--line2);border-radius:12px;
  padding:9px 15px;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100vw - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* larger screens: track tabs show english sub */
@media(min-width:560px){
  .ttab{font-size:12.5px;padding:9px 6px}
  .ttab .en{display:inline;font-size:10px;color:inherit;opacity:.72;font-weight:700;margin-left:3px}
  .stats .stat b{font-size:17px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true">🎙️</div>
      <div class="binfo">
        <h1>Echo &amp; Recall Studio</h1>
        <div class="sub">3트랙 회상 · 5회 듣기 · 실전 미션</div>
      </div>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="다크/라이트 테마 전환" title="테마 전환">🌙</button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="stat"><b id="statDue">0</b><span>이 트랙 복습 대기</span></div>
      <div class="stat"><b id="statStreak">0</b><span>연속 학습일</span></div>
      <div class="stat"><b id="statMastered">0%</b><span>이 트랙 숙달률</span></div>
    </div>

    <div class="tabs" role="tablist" aria-label="학습 트랙" id="trackTabs">
      <button class="ttab" type="button" role="tab" data-track="daily" aria-selected="true"><span class="em">☕</span><span class="lb">일상회화</span><span class="en">Daily</span></button>
      <button class="ttab" type="button" role="tab" data-track="travel" aria-selected="false"><span class="em">✈️</span><span class="lb">여행영어</span><span class="en">Travel</span></button>
      <button class="ttab" type="button" role="tab" data-track="business" aria-selected="false"><span class="em">💼</span><span class="lb">비즈니스</span><span class="en">Business</span></button>
    </div>

    <div class="mtabs" role="tablist" aria-label="학습 모드" id="modeTabs">
      <button class="mtab" type="button" role="tab" data-mode="recall" aria-selected="true"><span class="lb">🎧 회상·5회</span></button>
      <button class="mtab" type="button" role="tab" data-mode="drill" aria-selected="false"><span class="lb">⚡ 변형 드릴</span></button>
      <button class="mtab" type="button" role="tab" data-mode="project" aria-selected="false"><span class="lb">🎯 실전 미션</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="accbox" id="accentBox">
    <div class="acchead"><span class="k">억양 · ACCENT</span><span class="cur" id="accCur">🇺🇸 미국 (en-US)</span></div>
    <div class="accrow" role="group" aria-label="영어 억양 선택">
      <button class="acc" type="button" data-accent="en-US" aria-pressed="true"><span class="fl">🇺🇸</span><span class="nm">미국</span><span class="lc">en-US</span></button>
      <button class="acc" type="button" data-accent="en-GB" aria-pressed="false"><span class="fl">🇬🇧</span><span class="nm">영국</span><span class="lc">en-GB</span></button>
      <button class="acc" type="button" data-accent="en-AU" aria-pressed="false"><span class="fl">🇦🇺</span><span class="nm">호주</span><span class="lc">en-AU</span></button>

const LS_KEY = 'echoRecallStudio.v1';
const LS_THEME = 'echoRecallStudio.theme';
/* 4개국 억양 — voice.lang 매칭·발화 lang의 기준 */
const ACCENTS = [
  { key: 'en-US', flag: '🇺🇸', name: '미국' },
  { key: 'en-GB', flag: '🇬🇧', name: '영국' },
  { key: 'en-AU', flag: '🇦🇺', name: '호주' },
  { key: 'en-IN', flag: '🇮🇳', name: '인도' }
];
function accentDef(key) { return ACCENTS.find(a => a.key === key) || ACCENTS[0]; }
const DAY = 1440; /* 분 단위 하루 */
let memStore = null;

function readStore() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return memStore; }
}
function writeStore(v) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch (e) { memStore = v; }
}
const _saved = readStore() || {};
const st = {
  track: _saved.track || 'daily',
  mode: _saved.mode || 'recall',
  accent: ACCENTS.some(a => a.key === _saved.accent) ? _saved.accent : 'en-US',
  /* 억양별로 마지막에 고른 음성 이름 (localStorage 저장) */
  voices: (_saved.voices && typeof _saved.voices === 'object' && !Array.isArray(_saved.voices)) ? _saved.voices : {},
  srs: _saved.srs || {},
  days: _saved.days || {},
  proj: _saved.proj || {}
};
function save() { writeStore(st); }

const view = { cardId: null, revealed: false, hint: false, chal: false, drill: {}, proj: 0, model: {}, voice: null };

/* ============================================================
   4) 유틸
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function todayStr(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function srsOf(id) {
  const s = st.srs[id];
  return s ? Object.assign({}, s) : { ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0 };
}
function fmtIvl(min) {
  if (min < 60) return Math.max(1, Math.round(min)) + '분';
  if (min < DAY) return Math.round(min / 60) + '시간';
  const d = min / DAY;
  if (d < 30) return Math.round(d) + '일';
  return Math.round(d / 30) + '개월';
}
function nextIvl(id, rating) {
  const s = srsOf(id);
  if (rating === 'again') return 1;
  if (!s.reps || s.ivl < 1) return rating === 'hard' ? DAY : rating === 'good' ? 3 * DAY : 7 * DAY;
  const days = s.ivl / DAY;
  if (rating === 'hard') return Math.max(0.7, days * 1.2) * DAY;
  if (rating === 'good') return Math.max(2, days * s.ease) * DAY;
  return Math.max(3, days * s.ease * 1.3) * DAY;
}
function queueOf(track) {
  const cards = TRACKS[track].cards.slice();
  return cards.sort((a, b) => (srsOf(a.id).due - srsOf(b.id).due) || (a.id < b.id ? -1 : 1));
}
function dueOf(track) {
  const n = Date.now();
  return TRACKS[track].cards.filter(c => srsOf(c.id).due <= n);
}
function dueTotal() {
  return Object.keys(TRACKS).reduce((a, k) => a + dueOf(k).length, 0);
}
function streak() {
  let n = 0; const d = new Date();
  if (!st.days[todayStr(d)]) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 800; i++) {
    if (st.days[todayStr(d)]) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
}
function renderEn(en) {
  return en.split('/').map(part => {
    const html = esc(part.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return '<span class="chunk">' + html + '</span>';
  }).join('<span class="sl">/</span>');
}
function plain(en) {
  return en.replace(/\*\*/g, '').replace(/\s*\/\s*/g, ' ');
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function headerH() {
  const h = document.querySelector('.topbar');
  return h ? Math.round(h.getBoundingClientRect().height) : 200;
}
function scrollToEl(el) {
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - headerH() - 10;
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}

const TC_LIGHT = { daily: ['#0a8f7e', '#067260'], travel: ['#a26a00', '#7a4f00'], business: ['#5d43d6', '#432fb0'] };
function applyTrackColor() {

/* ============================================================
   6) 음성 (Web Speech API) — 4개국 억양 · 5회 루프
   ============================================================ */
const TTS = { token: 0 };
const PLAN = [
  { r: 1, rate: 0.98, label: '기본 속도' },
  { r: 2, rate: 0.98, label: '기본 속도' },
  { r: 3, rate: 0.85, label: '느리게 쉐도잉', gap: 1000 },
  { r: 4, rate: 0.85, label: '느리게 쉐도잉', gap: 1000 },
  { r: 5, rate: 1.0, label: '원속도' }
];
function ttsOK() {
  return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
}
/* lang 비교는 대소문자·-/_ 차이를 무시한다 (en_US / EN-gb 모두 같은 억양) */
function normLang(l) { return String(l || '').replace(/_/g, '-').trim().toLowerCase(); }
function sameAccent(lang, key) {
  const a = normLang(lang), b = normLang(key);
  return a === b || a.indexOf(b + '-') === 0;
}
function voicesAll() {
  if (!ttsOK()) return [];
  try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
}
function voicesForAccent(key) {
  return voicesAll().filter(v => sameAccent(v.lang, key));
}
function updateAccentUI() {
  const cur = accentDef(st.accent);
  $$('.acc').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.accent === st.accent)));
  const c = $('#accCur');
  if (c) c.textContent = cur.flag + ' ' + cur.name + ' (' + cur.key + ')';
  const w = $('#accWarn');
  if (w) w.classList.toggle('on', ttsOK() && voicesForAccent(st.accent).length === 0);
}
function updateVoiceLang() {
  const el = $('#voiceLang');
  if (el) el.textContent = st.accent + ' · 5회';
}
/* ------------------------------------------------------------
   VOICE 드롭다운 — 4개국 억양 전체를 optgroup 으로 한 번에
   · option value = "accent|voiceName" (음성이 없으면 "accent|__fallback__")
   · 상단 억양 4필과 양방향 동기화 + 억양별 선택 음성을 localStorage 에 저장
   ------------------------------------------------------------ */
const VOICE_FALLBACK = '__fallback__';
function savedVoice(acc) {
  const v = st.voices && st.voices[acc];
  return (typeof v === 'string' && v) ? v : null;
}
function setSavedVoice(acc, name) {
  if (!st.voices) st.voices = {};
  if (!name || name === VOICE_FALLBACK) { delete st.voices[acc]; return; }
  st.voices[acc] = name;
}
/* 그 억양에서 지금 보여 줄(=발화에 쓸) 음성 이름 */
function fillVoices() {
  const sel = $('#voiceSel');
  const vsAll = voicesAll();
  let dirty = false;
  const groups = ACCENTS.map(a => {
    const vs = vsAll.filter(v => sameAccent(v.lang, a.key));
    const saved = savedVoice(a.key);
    let pick = VOICE_FALLBACK;
    if (vs.length) {
      const v = vs.find(x => x.name === saved) || vs.find(x => x.default) || vs[0];
      pick = v.name;
      /* 저장된 음성이 사라졌으면 지금 고를 수 있는 음성으로 정리 */
      if (saved !== pick) { setSavedVoice(a.key, pick); dirty = true; }
    }
    return { a, vs, pick };
  });
  if (dirty) save();
  const cur = groups.find(g => g.a.key === st.accent) || groups[0];
  if (sel) {
    sel.innerHTML = groups.map(g => {
      const head = '<optgroup label="' + esc(g.a.flag + ' ' + g.a.name + ' (' + g.a.key + ')') + '">';
      const body = g.vs.length
        ? g.vs.map(v => '<option value="' + esc(g.a.key + '|' + v.name) + '">' + esc(v.name) + ' (' + esc(v.lang) + ')</option>').join('')
        : '<option value="' + esc(g.a.key + '|' + VOICE_FALLBACK) + '">' + esc(g.a.flag + ' ' + g.a.name + ' (기본 음성으로 재생)') + '</option>';
      return head + body + '</optgroup>';
    }).join('');
    sel.disabled = false;
    /* 현재 억양의 저장된(또는 첫) 음성을 선택 상태로 */
    sel.value = cur.a.key + '|' + cur.pick;
    if (sel.selectedIndex < 0 && sel.options.length) sel.selectedIndex = 0;
    view.voice = cur.pick === VOICE_FALLBACK ? null : cur.pick;
  }
  updateAccentUI();
  updateVoiceLang();
}
function pickedVoice() {
  const vs = voicesForAccent(st.accent);
  if (!vs.length) return null;
  const sel = $('#voiceSel');
  if (sel) {
    const raw = String(sel.value || '');
    const i = raw.indexOf('|');
    if (i > 0 && raw.slice(0, i) === st.accent) {
      const v = vs.find(x => x.name === raw.slice(i + 1));
      if (v) return v;
    }
  }
  return vs.find(x => x.name === savedVoice(st.accent)) || null;
}
/* VOICE 드롭다운에서 고른 값 적용 — 억양 필·저장소·발화 언어를 함께 맞춘다 */
function applyVoicePick(acc, name) {
  if (!ACCENTS.some(a => a.key === acc)) return;
  const vs = voicesForAccent(acc);
  const accentChanged = acc !== st.accent;
  st.accent = acc;
  setSavedVoice(acc, vs.some(v => v.name === name) ? name : VOICE_FALLBACK);
  save();
  stopTTS();
  fillVoices();
  const d = accentDef(acc);
  const vn = (name && name !== VOICE_FALLBACK && vs.some(v => v.name === name)) ? name : '기본 음성';
  toast(accentChanged
    ? '억양 · ' + d.flag + ' ' + d.name + ' (' + acc + ') · ' + vn
    : '음성 · ' + d.flag + ' ' + vn + ' (' + acc + ')');
}
function setAccent(key) {
  if (!ACCENTS.some(a => a.key === key)) return;
  const changed = key !== st.accent;
  st.accent = key;
  save();
  if (changed) stopTTS();
  view.voice = savedVoice(key);
  /* 필을 눌러도 VOICE 드롭다운이 그 억양의 저장 음성(없으면 첫 음성/기본)으로 맞춰진다 */
  fillVoices();
  if (changed) {
    const d = accentDef(key);
    toast('억양 · ' + d.flag + ' ' + d.name + ' (' + key + ')');
  }
}
function utter(text, rate, done) {
  const cb = done || function () { };
  if (!ttsOK()) {
    const w = text.trim().split(/\s+/).length;
    setTimeout(cb, Math.max(400, Math.round(w * 160)));
    return;
  }
  let u;
  try { u = new SpeechSynthesisUtterance(text); } catch (e) { setTimeout(cb, 800); return; }
  const v = pickedVoice();
  if (v) u.voice = v;
  /* 음성이 없어도 선택한 억양의 locale로 발화를 시도한다 */
  u.lang = v ? (v.lang || st.accent) : st.accent;
  u.rate = rate; u.pitch = 1; u.volume = 1;
  let fin = false;
  let tm = null;
  const end = () => { if (fin) return; fin = true; if (tm) clearTimeout(tm); cb(); };
  const words = text.trim().split(/\s+/).length;
  const ms = Math.min(9000, Math.max(1200, Math.round(words * 430 / rate))) + 450;
  tm = setTimeout(end, ms);
  u.onend = end; u.onerror = end;
  try { window.speechSynthesis.speak(u); } catch (e) { end(); }
}
function stopTTS() {
  TTS.token++;
  try { if (ttsOK()) window.speechSynthesis.cancel(); } catch (e) { }
}
function setBadge(el, txt, idle) {
  if (!el) return;
  el.innerHTML = txt;
  el.classList.toggle('idle', !!idle);
}
async function runFive(text, badgeId) {
  stopTTS();
  const my = ++TTS.token;
  const badge = badgeId ? document.getElementById(badgeId) : null;
  for (const p of PLAN) {
    if (my !== TTS.token) return;
    if (p.gap) await new Promise(r => setTimeout(r, p.gap));
    if (my !== TTS.token) return;
    setBadge(badge, '<span class="pulse"></span>🔊 ' + p.r + '/5회 · ' + p.label, false);
    await new Promise(res => utter(text, p.rate, res));
  }
  if (my !== TTS.token) return;
  setBadge(badge, '✅ 5회 완료 · 이제 직접 말해 보세요', false);
}

function renderRecall() {

        '</div>' +
        '<div class="steps" aria-hidden="true">' +
          '<span class="stp ' + (view.revealed ? 'done' : 'on') + '">1 노출</span><span class="ar">›</span>' +
          '<span class="stp ' + (view.revealed ? 'done' : '') + '">2 정답·5회</span><span class="ar">›</span>' +
          '<span class="stp ' + (view.revealed ? 'on' : '') + '">3 쉐도잉</span><span class="ar">›</span>' +
          '<span class="stp">4 평가</span>' +
        '</div>' +
        '<p class="ko-sit">' + esc(card.sit) + '</p>' +
        '<p class="ko-target"><span class="tg">목표</span>' + esc(card.ko) + '</p>' +
        '<div class="toolrow">' +
          '<button class="tool" type="button" id="chalBtn" aria-pressed="' + (view.chal ? 'true' : 'false') + '">⏱️ 3초 챌린지 ' + (view.chal ? 'ON' : 'OFF') + '</button>' +
          '<button class="tool" type="button" id="hintBtn" aria-pressed="' + (view.hint ? 'true' : 'false') + '">💡 첫 단어 힌트</button>' +
        '</div>' +
        '<div class="chal' + (view.chal ? ' on' : '') + '" id="chalBox">' +
          '<div class="row"><span id="chalLbl">3초 안에 말해 보세요</span><b id="chalTime">3.0s</b></div>' +
          '<div class="bar"><i></i></div>' +
        '</div>' +
        '<div class="hintbox' + (view.hint ? ' on' : '') + '" id="hintBox"><span class="k">FIRST WORDS</span>' + esc(card.hint) + '</div>' +
        '<button class="btn-primary" type="button" id="revealBtn"' + (view.revealed ? ' hidden' : '') + '>🎧 정답 확인 + 5회 듣기</button>' +
        '<div class="answer' + (view.revealed ? ' on' : '') + '" id="answerBox">' +
          '<p class="en">' + renderEn(card.en) + '</p>' +
          '<p class="nuance"><b>뉘앙스</b> · ' + esc(card.nuance) + '</p>' +
          '<div class="ttsbar">' +
            '<div class="ttshead"><span class="roundbadge idle" id="roundBadge">🔊 대기 중</span><span id="voiceLang" style="font-size:10px;font-weight:800;color:var(--tx3)">' + st.accent + ' · 5회</span></div>' +
            '<div class="ttsctl">' +
              '<button type="button" class="stop" id="stopBtn">⏸ 중지</button>' +
              '<button type="button" id="againBtn">🔁 다시 5회</button>' +
              '<button type="button" id="onceBtn">🔊 1회</button>' +
            '</div>' +
            '<div class="voicerow"><label for="voiceSel">VOICE</label><select id="voiceSel"></select></div>' +
            '<div class="ttswarn" id="ttsWarn">이 브라우저에서는 음성 합성을 쓸 수 없습니다. 문장을 소리 내어 직접 읽어 보세요.</div>' +
          '</div>' +
          '<div class="shadow"><span class="em">🗣️</span><div><b>3회차부터</b> 작게 따라 말하며 연음·강세를 체크하세요. <b>4회차</b>는 한 박자 늦게 겹쳐 말하면 쉐도잉이 쉽습니다.</div></div>' +
          '<div class="srshead"><span class="t">4단계 · 오늘 기억 정도를 고르세요</span><span class="n">간격 자동 계산</span></div>' +
          '<div class="srs">' +
            '<button type="button" data-r="again"><span class="r">Again</span><span class="i">' + fmtIvl(nextIvl(card.id, 'again')) + '</span></button>' +
            '<button type="button" data-r="hard"><span class="r">Hard</span><span class="i">' + fmtIvl(nextIvl(card.id, 'hard')) + '</span></button>' +
            '<button type="button" data-r="good"><span class="r">Good</span><span class="i">' + fmtIvl(nextIvl(card.id, 'good')) + '</span></button>' +
            '<button type="button" data-r="easy"><span class="r">Easy</span><span class="i">' + fmtIvl(nextIvl(card.id, 'easy')) + '</span></button>' +
          '</div>' +
          '<div class="srsdone" id="srsDone"></div>' +
        '</div>' +
      '</div>' +
    '</article>';

  fillVoices();
  if (!ttsOK()) { const w = $('#ttsWarn'); if (w) w.classList.add('on'); }
  bindRecall(card);
  if (view.chal) startChal();
}

function bindRecall(card) {
  const revealBtn = $('#revealBtn');
  if (revealBtn) revealBtn.addEventListener('click', () => {
    view.revealed = true;
    revealBtn.hidden = true;
    const box = $('#answerBox');
    box.classList.add('on');
    fillVoices();
    scrollToEl(box);
    runFive(plain(card.en), 'roundBadge');
  });
  const chalBtn = $('#chalBtn');
  if (chalBtn) chalBtn.addEventListener('click', () => {
    view.chal = !view.chal;
    chalBtn.setAttribute('aria-pressed', String(view.chal));
    chalBtn.textContent = '⏱️ 3초 챌린지 ' + (view.chal ? 'ON' : 'OFF');
    if (view.chal) startChal(); else stopChal();
  });
  const hintBtn = $('#hintBtn');
  if (hintBtn) hintBtn.addEventListener('click', () => {
    view.hint = !view.hint;
    hintBtn.setAttribute('aria-pressed', String(view.hint));
    $('#hintBox').classList.toggle('on', view.hint);
  });
  const stopBtn = $('#stopBtn');
  if (stopBtn) stopBtn.addEventListener('click', () => {
    stopTTS();
    setBadge($('#roundBadge'), '⏸ 정지됨 · 다시 들으려면 🔁', false);
  });
  const againBtn = $('#againBtn');
  if (againBtn) againBtn.addEventListener('click', () => runFive(plain(card.en), 'roundBadge'));
  const onceBtn = $('#onceBtn');
  if (onceBtn) onceBtn.addEventListener('click', () => {
    stopTTS();
    const my = ++TTS.token;
    setBadge($('#roundBadge'), '<span class="pulse"></span>🔊 1회 재생', false);
    utter(plain(card.en), 1.0, () => { if (my === TTS.token) setBadge($('#roundBadge'), '🔊 1회 완료', true); });
  });
  const sel = $('#voiceSel');
  if (sel) sel.addEventListener('change', () => {
    const raw = String(sel.value || '');
    const i = raw.indexOf('|');
    if (i < 0) return;
    const acc = raw.slice(0, i), name = raw.slice(i + 1);
    applyVoicePick(acc, name);
    if (!ACCENTS.some(a => a.key === acc)) return;
    const badge = $('#roundBadge');
    if (badge && !badge.classList.contains('idle')) setBadge(badge, '⏸ 음성 변경 · 다시 들으려면 🔁', false);
  });
  $$('.srs button').forEach(b => b.addEventListener('click', () => rate(card, b.dataset.r)));
}

function startChal() {
  const box = $('#chalBox'), t = $('#chalTime'), lbl = $('#chalLbl');
  if (!box) return;
  box.classList.add('on');
  box.classList.remove('done');
  const bar = box.querySelector('.bar i');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = '';
  let left = 3000;
  t.textContent = '3.0s';
  lbl.textContent = '3초 안에 말해 보세요';
  clearInterval(chalTimer);
  chalTimer = setInterval(() => {
    left -= 100;
    if (left <= 0) {
      clearInterval(chalTimer);
      t.textContent = '0.0s';
      box.classList.add('done');
      lbl.textContent = '시간 종료 — 정답을 확인하세요';
    } else {
      t.textContent = (left / 1000).toFixed(1) + 's';
    }
  }, 100);
}
function stopChal() {
  clearInterval(chalTimer);
  const box = $('#chalBox');
  if (box) box.classList.remove('on', 'done');
}

const RATING_KO = { again: 'Again', hard: 'Hard', good: 'Good', easy: 'Easy' };
function rate(card, rating) {
  const s = srsOf(card.id);
  const ivl = Math.round(nextIvl(card.id, rating));
  if (rating === 'again') { s.ease = Math.max(1.3, s.ease - 0.2); s.lapses++; s.reps = 0; }
  else if (rating === 'hard') { s.ease = Math.max(1.3, s.ease - 0.15); s.reps++; }
  else if (rating === 'good') { s.reps++; }
  else { s.ease = Math.min(3, +(s.ease + 0.15).toFixed(2)); s.reps++; }
  s.ivl = ivl;
  s.due = Date.now() + ivl * 60000;
  st.srs[card.id] = s;
  const k = todayStr();
  st.days[k] = (st.days[k] || 0) + 1;
  save();
  toast(RATING_KO[rating] + ' · 다음 복습 ' + fmtIvl(s.ivl) + ' 뒤');
  nextCard(card.id);
}
function nextCard(fromId) {
  stopTTS();
  const q = queueOf(st.track);
  const i = q.findIndex(c => c.id === fromId);
  const next = q[(i + 1) % q.length];
  view.cardId = next ? next.id : null;
  view.revealed = false; view.hint = false; view.chal = false;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ============================================================
   9) 모드 2 — 변형 드릴
   ============================================================ */
function drillState(track) {
  if (!view.drill[track]) view.drill[track] = { pat: 0, s: 0, t: 0, c: 0 };
  return view.drill[track];
}
function renderDrill() {
  const tr = TRACKS[st.track];
  const d = drillState(st.track);
  const p = tr.patterns[d.pat] || tr.patterns[0];
  const out = p.build(d.s, d.t, d.c).replace(/\s*\/\s*/g, ' ');
  const condText = p.conds[d.c];
  const alt = condText.replace(/\bmy\b/g, 'our');
  let html = esc(out);
  const hit = html.indexOf(esc(condText)) >= 0 ? esc(condText) : (html.indexOf(esc(alt)) >= 0 ? esc(alt) : null);
  if (hit) html = html.replace(hit, '<span class="v">' + hit + '</span>');

  $('#drillCue').innerHTML = cueHTML('핵심 패턴 ' + tr.patterns.length + '개 · 조합 ' + (p.subs.length * p.tenses.length * p.conds.length) + '가지');
  $('#drillBody').innerHTML =
    '<div class="card"><div class="pad">' +
      '<div class="sec-h"><h2>⚡ 변형 드릴</h2><span class="s">' + esc(tr.name) + ' · 탭해서 문장을 바꿔 보세요</span></div>' +
      '<div class="patsel">' + tr.patterns.map((pp, i) =>
        '<button class="pat" type="button" data-pat="' + i + '" aria-pressed="' + (i === d.pat) + '">' +
          '<span class="k">' + esc(pp.ko) + '</span><span class="e">' + esc(pp.title) + '</span></button>').join('') +
      '</div>' +
      '<div class="pgroup"><div class="gl"><span class="num">1</span>주체 (SUBJECT)</div><div class="pills">' +
        p.subs.map((s, i) => '<button class="pill" type="button" data-s="' + i + '" aria-pressed="' + (i === d.s) + '">' + esc(s) + '</button>').join('') +
      '</div></div>' +
      '<div class="pgroup"><div class="gl"><span class="num">2</span>시제 (TENSE)</div><div class="pills">' +
        p.tenses.map((s, i) => '<button class="pill" type="button" data-t="' + i + '" aria-pressed="' + (i === d.t) + '">' + esc(s) + '</button>').join('') +
      '</div></div>' +
      '<div class="pgroup"><div class="gl"><span class="num">3</span>상황 조건 (CONDITION)</div><div class="pills">' +
        p.conds.map((s, i) => '<button class="pill" type="button" data-c="' + i + '" aria-pressed="' + (i === d.c) + '">' + esc(s) + '</button>').join('') +
      '</div></div>' +
      '<div class="outbox"><p class="out" id="drillOut">' + html + '</p>' +
        '<p class="outko">' + esc(p.title) + ' · ' + esc(p.subs[d.s]) + ' / ' + esc(p.tenses[d.t]) + '</p></div>' +
      '<div class="drillbtns"><button class="main" type="button" id="drillSpeak">🔊 들어보기</button><button type="button" id="drillOnce">1회</button></div>' +
      '<div class="pnote">' + esc(p.note) + '</div>' +
    '</div></div>';

  const speak = () => recallSpeak(plain(out), 'drillOut');
  const b1 = $('#drillSpeak'); if (b1) b1.addEventListener('click', speak);
  const b2 = $('#drillOnce'); if (b2) b2.addEventListener('click', () => { stopTTS(); utter(plain(out), 1.0, () => { }); toast('1회 재생'); });
}
function recallSpeak(text, anchorId) {
  const anchor = anchorId ? document.getElementById(anchorId) : null;
  if (anchor) {
    anchor.style.transition = 'color .2s';
    anchor.style.color = 'var(--tc)';
    setTimeout(() => { anchor.style.color = ''; }, 900);
  }
  stopTTS();
  utter(text, 0.95, () => { });
  toast('🔊 ' + text.slice(0, 42) + (text.length > 42 ? '…' : ''));
}

/* ============================================================
   10) 모드 3 — 실전 미션
   ============================================================ */
function renderProject() {
  const tr = TRACKS[st.track];
  const mi = Math.min(view.proj || 0, tr.projects.length - 1);
  const m = tr.projects[mi];
  const done = st.proj[m.id] || [false, false, false];
  const doneN = done.filter(Boolean).length;

  $('#projectCue').innerHTML = cueHTML('미션 ' + tr.projects.length + '개 · 3턴 롤플레이');
  $('#projectBody').innerHTML =
    '<div class="missel">' + tr.projects.map((mm, i) => {
      const dd = (st.proj[mm.id] || []).filter(Boolean).length;
      return '<button class="mis" type="button" data-mis="' + i + '" aria-pressed="' + (i === mi) + '">' +
        '<span class="ico">' + mm.icon + '</span>' +
        '<span class="tx"><b>' + esc(mm.title) + '</b><span>' + esc(mm.sub) + '</span></span>' +
        '<span class="st' + (dd === 3 ? '' : ' off') + '">' + dd + '/3</span></button>';
    }).join('') + '</div>' +
    '<div class="misbox"><div class="mt">' + m.icon + ' ' + esc(m.title) + '</div>' +
      '<div class="ms">' + esc(m.goal) + '</div>' +
      '<div class="mprog"><div class="bar"><i style="width:' + (doneN / 3 * 100) + '%"></i></div><span>' + doneN + ' / 3 턴</span></div>' +
    '</div>' +
    m.turns.map((t, i) => {
      const id = 'model-' + m.id + '-' + i;
      const open = !!view.model[m.id + ':' + i];
      return '<div class="turn' + (done[i] ? ' completed' : '') + '">' +
        '<div class="th"><span class="n">' + (i + 1) + '</span><span class="l">TURN ' + (i + 1) + ' · ' + esc(t.who) + '</span></div>' +
        '<div class="tb">' +
          '<div class="partner"><div class="av">🎧</div><div class="tx"><div class="who">' + esc(t.who) + '</div><p class="en">' + esc(t.partner) + '</p></div>' +
            '<button type="button" data-hear="' + i + '">🔊 상대방 말</button></div>' +
          '<div class="userq"><div class="who">MY LINE</div><div class="ko">' + esc(t.ask) + '</div></div>' +
          '<div class="tbtns"><button class="main" type="button" data-model="' + i + '">모범 답안 + 5회 듣기</button>' +
            '<button type="button" data-once="' + i + '">🔊 1회</button></div>' +
          '<div class="model' + (open ? ' on' : '') + '" id="' + id + '">' +
            '<p class="en">' + renderEn(t.model) + '</p>' +
            '<p class="nk">' + esc(t.note) + '</p>' +
            '<div class="ttshead" style="margin-top:7px"><span class="roundbadge idle" id="pb-' + m.id + '-' + i + '">🔊 대기 중</span></div>' +
            '<div class="tbtns" style="margin-top:7px"><button type="button" data-stop="' + i + '">⏸ 중지</button><button type="button" data-again="' + i + '">🔁 다시 5회</button></div>' +
          '</div>' +
        '</div>' +
        '<label class="done"><input type="checkbox" data-check="' + i + '"' + (done[i] ? ' checked' : '') + '> 이 턴 완료로 표시</label>' +
      '</div>';
    }).join('');
  bindProject(m, done);
}
function bindProject(m, done) {
  $$('#projectBody .mis').forEach(b => b.addEventListener('click', () => {
    view.proj = +b.dataset.mis;
    stopTTS();
    renderProject();
  }));
  $$('#projectBody [data-hear]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.hear;
    stopTTS();
    utter(m.turns[i].partner, 1.0, () => { });
    toast('🔊 상대방 말 재생');
  }));
  $$('#projectBody [data-model]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.model;
    view.model[m.id + ':' + i] = true;
    const box = document.getElementById('model-' + m.id + '-' + i);
    if (box) {
      box.classList.add('on');
      scrollToEl(box);
      runFive(plain(m.turns[i].model), 'pb-' + m.id + '-' + i);
    }
  }));
  $$('#projectBody [data-once]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.once;
    stopTTS();
    utter(plain(m.turns[i].model), 1.0, () => { });
    toast('🔊 모범 답안 1회 재생');
  }));
  $$('#projectBody [data-stop]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.stop;
    stopTTS();
    setBadge(document.getElementById('pb-' + m.id + '-' + i), '⏸ 정지됨 · 다시 들으려면 🔁', false);
  }));
  $$('#projectBody [data-again]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.again;
    view.model[m.id + ':' + i] = true;
    const box = document.getElementById('model-' + m.id + '-' + i);
    if (box) box.classList.add('on');
    runFive(plain(m.turns[i].model), 'pb-' + m.id + '-' + i);
  }));
  $$('#projectBody [data-check]').forEach(cb => cb.addEventListener('change', () => {
    const i = +cb.dataset.check;
    const arr = (st.proj[m.id] || [false, false, false]).slice();
    arr[i] = cb.checked;
    st.proj[m.id] = arr;
    save();
    renderHeader();
    renderProject();
    const n = arr.filter(Boolean).length;
    toast(n === 3 ? '🎉 미션 완료! 3턴을 모두 마쳤습니다' : n + '/3 턴 완료');
  }));
}

/* ============================================================
   11) 렌더 · 이벤트
   ============================================================ */
function renderAll() {
  renderHeader();
  if (st.mode === 'recall') renderRecall();
  else if (st.mode === 'drill') renderDrill();
  else renderProject();
}
function setTrack(t) {
  if (!TRACKS[t]) return;
  st.track = t; save();
  stopTTS();
  view.cardId = null; view.revealed = false; view.hint = false; view.chal = false;
  view.proj = 0;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function setMode(m) {
  st.mode = m; save();
  stopTTS();
  renderAll();
}
document.addEventListener('click', e => {
  const ab = e.target.closest('.acc');
  if (ab) { setAccent(ab.dataset.accent); return; }
  const tb = e.target.closest('[data-track]');
  if (tb) { setTrack(tb.dataset.track); return; }
  const mb = e.target.closest('[data-mode]');
  if (mb) { setMode(mb.dataset.mode); return; }
  const pat = e.target.closest('.pat');
  if (pat) {
    const d = drillState(st.track);
    d.pat = +pat.dataset.pat; d.s = 0; d.t = 0; d.c = 0;
    renderDrill();
    return;
  }
  const pill = e.target.closest('.pill');
  if (pill) {
    const d = drillState(st.track);
    if (pill.dataset.s !== undefined && pill.dataset.s !== '') d.s = +pill.dataset.s;
    if (pill.dataset.t !== undefined && pill.dataset.t !== '') d.t = +pill.dataset.t;
    if (pill.dataset.c !== undefined && pill.dataset.c !== '') d.c = +pill.dataset.c;
    renderDrill();
    return;
  }
});
$('#themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('학습 기록(SRS 간격·연속일·미션 체크)을 모두 지울까요? 되돌릴 수 없습니다.')) return;
  st.srs = {}; st.days = {}; st.proj = {};
  save();
  view.cardId = null; view.revealed = false; view.model = {};
  renderAll();
  toast('학습 기록을 초기화했습니다');
});
if (ttsOK()) {
  try {
    window.speechSynthesis.addEventListener('voiceschanged', fillVoices);
    window.speechSynthesis.getVoices();
  } catch (e) { }
}
initTheme();
updateAccentUI();
renderAll();
setTimeout(() => { fillVoices(); updateAccentUI(); }, 250);
</script>
