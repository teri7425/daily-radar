  <title>소리튠 해외여행 영어 402문장 완전정복</title>
  <!-- Tailwind CSS with Dark Mode Class Support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'Inter', 'sans-serif'],
            en: ['Inter', 'Noto Sans KR', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 플래시카드 전환 효과 */
    .flashcard-pop {
      animation: cardPop 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardPop {
      0% { opacity: 0.4; transform: scale(0.97) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(79, 70, 229, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .active-rep-dot {
      animation: pulseRing 1.4s infinite;
    }
    /* 퀴즈 정답 축하 토스트 & 색종이 (가벼운 CSS 애니메이션) */
    .celebrate-toast {
      position: fixed;
      left: 50%;
      top: 46%;
      z-index: 60;
      pointer-events: none;
      animation: celebratePop 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes celebratePop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      70% { opacity: 1; transform: translate(-50%, -54%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -68%) scale(0.98); }
    }
    .confetti-layer { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      top: -12%;
      border-radius: 2px;
      animation-name: confettiFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    @keyframes confettiFall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }

    const FUNCTION_WORDS = new Set([
      'a', 'an', 'the', 'to', 'of', 'in', 'on', 'at', 'for', 'with', 'by', 'from',
      'is', 'are', 'am', 'was', 'were', 'be', 'been', 'do', 'does', 'did',

    ]);

    function formatRhythmHighlight(sentence) {
      // 패턴 핵심 소리블록 추출
      return sentence.split(' ').map(word => {
        const clean = word.toLowerCase().replace(/[^a-z']/g, '');
        const isContentWord = clean.length >= 3 && !FUNCTION_WORDS.has(clean);
        if (isContentWord) {
          return `<span class="font-extrabold text-indigo-700 dark:text-indigo-300 underline decoration-indigo-300/80 dark:decoration-indigo-600 decoration-2 underline-offset-4">${word}</span>`;
        }
        return `<span class="text-slate-600 dark:text-slate-400 font-medium">${word}</span>`;
      }).join(' ');
    }

    // 예) "Could I get a coffee, please?" → "Could I ___ ___ coffee, ___"
    function buildHintSentence(sentence) {
      const words = String(sentence || '').trim().split(/\s+/).filter(Boolean);
      if (words.length <= 2) return String(sentence || '');

      let keyIdx = -1;
      let best = 0;
      for (let i = 2; i < words.length - 1; i++) {
        const clean = words[i].toLowerCase().replace(/[^a-z']/g, '');
        if (clean.length >= 3 && !FUNCTION_WORDS.has(clean) && clean.length > best) {
          best = clean.length;
          keyIdx = i;
        }
      }
      if (keyIdx < 0 && words.length > 3) keyIdx = 2; // 중간에 내용어가 없으면 세 번째 단어를 공개

      return words.map((w, i) => (i < 2 || i === keyIdx) ? w : '___').join(' ');
    }

          state.starred = parsed.starred || {};
          state.difficult = (parsed.difficult && typeof parsed.difficult === 'object') ? parsed.difficult : {};
          state.category = parsed.category || 'all';
          state.mode = parsed.mode || 'list';
          state.currentPage = parsed.currentPage || 1;
          state.flashIndex = parsed.flashIndex || 0;
          state.darkMode = Boolean(parsed.darkMode);
          state.accent = ACCENTS[parsed.accent] ? parsed.accent : 'en-US';
          state.voiceByAccent = (parsed.voiceByAccent && typeof parsed.voiceByAccent === 'object') ? parsed.voiceByAccent : {};
          state.repeatPace = REPEAT_PACES[parsed.repeatPace]
            ? parsed.repeatPace
            : ((parsed.repeatPace === 'slow' || parsed.repeatPace === 'normal') ? 'steady' : 'mix');
          state.speed = SPEEDS.indexOf(Number(parsed.speed)) >= 0 ? Number(parsed.speed) : 1.0;
          state.mission = (parsed.mission && typeof parsed.mission === 'object')
            ? { date: parsed.mission.date || '', goal: Number(parsed.mission.goal) || 10, studied: parsed.mission.studied || {} }
            : { date: '', goal: 10, studied: {} };
          state.streak = (parsed.streak && typeof parsed.streak === 'object')
            ? { count: Number(parsed.streak.count) || 0, lastGoalDate: parsed.streak.lastGoalDate || '' }
            : { count: 0, lastGoalDate: '' };
        }
        ensureMissionToday();
      } catch (e) {
        console.error('State load error:', e);
      }
      applyDarkModeClass();
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          memorized: state.memorized,
          starred: state.starred,
          difficult: state.difficult,
          category: state.category,
          mode: state.mode,
          currentPage: state.currentPage,
          flashIndex: state.flashIndex,
          darkMode: state.darkMode,
          accent: state.accent,
          voiceByAccent: state.voiceByAccent,
          repeatPace: state.repeatPace,
          speed: state.speed,
          mission: state.mission,
          streak: state.streak
        }));
      } catch (e) {
        console.error('State save error:', e);
      }
    }

    function applyDarkModeClass() {
      const htmlEl = document.documentElement;
      const btn = document.getElementById('darkModeBtn');
      if (state.darkMode) {
        htmlEl.classList.add('dark');
        if (btn) btn.textContent = '☀️';
      } else {
        htmlEl.classList.remove('dark');
        if (btn) btn.textContent = '🌙';
      }
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      applyDarkModeClass();
      saveAppState();
    }

    // =========================================================================
    // 3-1. 오늘의 미션 · 연속 학습일 · 정답 축하 효과
    // =========================================================================
    function dateKey(d = new Date()) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function yesterdayKey() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return dateKey(d);
    }

    // 날짜가 바뀌면 오늘의 미션 진행만 새로 시작한다 (연속 학습일 기록은 유지)
    function ensureMissionToday() {
      const today = dateKey();
      if (!state.mission || typeof state.mission !== 'object') {
        state.mission = { date: today, goal: 10, studied: {} };
      } else if (state.mission.date !== today) {
        state.mission = { date: today, goal: Number(state.mission.goal) || 10, studied: {} };
      }
      if (!state.streak || typeof state.streak !== 'object') {
        state.streak = { count: 0, lastGoalDate: '' };
      }
      return state.mission;
    }

    function studiedTodayCount() {
      ensureMissionToday();
      return Object.keys(state.mission.studied).length;
    }

    function isStreakAlive() {
      const last = state.streak && state.streak.lastGoalDate;
      return Boolean(last) && (last === dateKey() || last === yesterdayKey());
    }

    function awardStreak() {
      ensureMissionToday();
      const today = dateKey();
      if (state.streak.lastGoalDate === today) return;
      state.streak.count = (state.streak.lastGoalDate === yesterdayKey())
        ? (Number(state.streak.count) || 0) + 1
        : 1;
      state.streak.lastGoalDate = today;
      saveAppState();
      burstConfetti(26);
      showCelebrate(`오늘의 미션 완료! 🔥 ${state.streak.count}일 연속`, '🎯');
    }

    // 오늘 학습한 문장으로 기록 (듣기·암기 체크·퀴즈 정답 모두 포함)
    function markStudied(id) {
      ensureMissionToday();
      if (state.mission.studied[id]) {
        updateMissionUI();
        return;
      }
      state.mission.studied[id] = true;
      if (studiedTodayCount() >= state.mission.goal) awardStreak();
      saveAppState();
      updateMissionUI();
    }

    function updateMissionUI() {
      ensureMissionToday();
      const goal = Number(state.mission.goal) || 10;
      const done = studiedTodayCount();
      const pct = Math.min(100, Math.round((done / goal) * 100));
      const label = document.getElementById('missionLabel');
      const bar = document.getElementById('missionBar');
      const badge = document.getElementById('streakBadge');

      if (label) {
        label.textContent = done >= goal
          ? `🎯 오늘의 미션 완료! (${done}/${goal})`
          : `🎯 오늘의 미션 ${done}/${goal}`;
      }
      if (bar) bar.style.width = `${pct}%`;
      if (badge) {
        if (isStreakAlive()) {
          badge.textContent = `🔥 ${state.streak.count}일 연속`;
          badge.className = 'px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 border border-amber-200/70 dark:border-amber-900/80 whitespace-nowrap';
        } else {
          badge.textContent = '🔥 0일 연속';
          badge.className = 'px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border border-slate-200/70 dark:border-slate-700 whitespace-nowrap';
        }
      }
    }

    function setMissionGoal(goal) {
      const g = [5, 10, 20, 30].indexOf(Number(goal)) >= 0 ? Number(goal) : 10;
      ensureMissionToday();
      state.mission.goal = g;
      if (studiedTodayCount() >= g) awardStreak();
      saveAppState();
      updateMissionUI();
      closeModal();
    }

    function openMissionGoalModal() {
      ensureMissionToday();
      const current = Number(state.mission.goal) || 10;
      const buttons = [5, 10, 20, 30].map(g =>
        `<button onclick="setMissionGoal(${g})" class="px-3 py-2 rounded-xl text-xs font-extrabold ${
          g === current ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200'
        }">${g}문장</button>`
      ).join('');
      showModal(
        '오늘의 미션 목표',
        `하루에 몇 문장을 들어볼까요? (지금 목표 ${current}문장 · 오늘 ${studiedTodayCount()}문장 완료)`,
        `<div class="grid grid-cols-3 gap-1.5 w-full">${buttons}<button onclick="closeModal()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-xs font-extrabold">닫기</button></div>`
      );
    }

    function showCelebrate(text, emoji = '🎉') {
      const el = document.createElement('div');
      el.className = 'celebrate-toast';
      el.innerHTML = `
        <div class="bg-slate-900/95 text-white rounded-2xl px-4 py-2.5 shadow-2xl border border-white/10 text-center">
          <div class="text-2xl leading-none mb-1">${emoji}</div>
          <div class="text-xs font-extrabold whitespace-nowrap">${escapeHtml(text)}</div>
        </div>
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function burstConfetti(count = 18) {
      const colors = ['#6366f1', '#22c55e', '#f59e0b', '#ef4444', '#06b6d4', '#a855f7'];
      const layer = document.createElement('div');
      layer.className = 'confetti-layer';
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.width = `${5 + Math.random() * 5}px`;
        piece.style.height = `${8 + Math.random() * 7}px`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${(Math.random() * 0.3).toFixed(2)}s`;
        piece.style.animationDuration = `${(1.1 + Math.random() * 0.8).toFixed(2)}s`;
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      setTimeout(() => layer.remove(), 2400);
    }

    // =========================================================================
    // 4. 필터링 & 검색 데이터 계산
    // =========================================================================
    function getFilteredSentences() {
      const q = state.searchQuery.trim().toLowerCase();
      return SENTENCES.filter(item => {
        if (state.category !== 'all' && item.category !== state.category) return false;
        if (state.statusFilter === 'memorized' && !state.memorized[item.id]) return false;
        if (state.statusFilter === 'unmemorized' && state.memorized[item.id]) return false;
        if (state.statusFilter === 'starred' && !state.starred[item.id]) return false;
        if (state.statusFilter === 'hard' && !state.difficult[item.id]) return false;
        if (q) {
          const matchEn = item.en.toLowerCase().includes(q);
          const matchKo = item.ko.toLowerCase().includes(q);
          const matchTag = item.tag.toLowerCase().includes(q);
          if (!matchEn && !matchKo && !matchTag) return false;
        }
        return true;
      });
    }

    // =========================================================================
    // 5. 원어민 TTS 음성 출력 (4개국 억양 / 듣기 속도 5단계 / 5·10회 반복 듣기)
    // =========================================================================
    // 4개국 억양 정의 — speechSynthesis의 lang 코드와 1:1 대응
    const ACCENTS = {
      'en-US': { flag: '🇺🇸', label: '미국', code: 'US' },
      'en-GB': { flag: '🇬🇧', label: '영국', code: 'UK' },
      'en-AU': { flag: '🇦🇺', label: '호주', code: 'AU' },
      'en-IN': { flag: '🇮🇳', label: '인도', code: 'IN' }
    };
    const ACCENT_ORDER = ['en-US', 'en-GB', 'en-AU', 'en-IN'];
    // 기기에 여러 음성이 있을 때 좀 더 자연스러운 음성을 먼저 고른다
    const PREFERRED_VOICE_RE = /(google|natural|neural|enhanced|premium|samantha|daniel|karen|moira|tessa|rishi|neerja)/i;

    function normalizeLang(lang) {
      return String(lang || '').replace(/_/g, '-').toLowerCase();
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getEnglishVoices() {
      if (!('speechSynthesis' in window) || typeof window.speechSynthesis.getVoices !== 'function') return [];
      try {
        return (window.speechSynthesis.getVoices() || [])
          .filter(v => v && v.lang && normalizeLang(v.lang).indexOf('en') === 0);
      } catch (e) {
        console.error('Voice list error:', e);
        return [];
      }
    }

    // 현재 억양에 맞는 기기 음성 선택: 저장한 음성 → 자연스러운 음성 → 첫 후보
    function pickVoiceForAccent(accent, voiceList = null) {
      const all = voiceList || getEnglishVoices();
      const target = normalizeLang(accent);
      const exact = all.filter(v => normalizeLang(v.lang) === target);
      if (!exact.length) return null;
      const savedUri = (state.voiceByAccent || {})[accent];
      if (savedUri) {
        const saved = exact.find(v => v.voiceURI === savedUri);
        if (saved) return saved;
      }
      return exact.find(v => PREFERRED_VOICE_RE.test(v.name)) || exact[0];
    }

    function speakText(text, rate = 1.0, onEnd = null, accentOverride = null) {
      if (!('speechSynthesis' in window)) {
        showModal('음성 지원 안내', '현재 브라우저에서는 TTS 음성 재생이 지원되지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const accent = ACCENTS[accentOverride] ? accentOverride : (ACCENTS[state.accent] ? state.accent : 'en-US');
      utter.lang = accent;
      utter.rate = rate;
      utter.pitch = 1.0;

      // 선택한 억양 음성 → 없으면 같은 영어 계열 음성으로 자동 대체 (재생이 끊기지 않게)
      const voice = pickVoiceForAccent(accent) || getEnglishVoices()[0] || null;
      if (voice) {
        utter.voice = voice;
        if (normalizeLang(voice.lang) !== normalizeLang(accent)) utter.lang = voice.lang || accent;
      }

      // onend/onerror가 둘 다 불려도 콜백은 한 번만 (5회 반복 진행이 꼬이지 않도록)
      let finished = false;
      const finish = () => { if (finished) return; finished = true; if (onEnd) onEnd(); };
      utter.onend = finish;
      utter.onerror = finish;
      window.speechSynthesis.speak(utter);
    }

    // ---------- 4개국 억양 선택기 & 기기 음성 선택 UI ----------
    function renderAccentPills() {
      const box = document.getElementById('accentPills');
      if (!box) return;
      box.innerHTML = ACCENT_ORDER.map(code => {
        const a = ACCENTS[code];
        const active = state.accent === code;
        return `
          <button type="button" onclick="setAccent('${code}')" aria-pressed="${active}"
            class="px-1 py-1.5 rounded-lg border text-[11px] font-extrabold flex items-center justify-center gap-1 transition active:scale-95 ${
              active
                ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
            }">
            <span class="text-[12px] leading-none">${a.flag}</span><span>${a.label}</span>
          </button>
        `;
      }).join('');
    }

    function setAccent(code) {
      if (!ACCENTS[code] || state.accent === code) return;
      stopRepeatPlayback();
      state.accent = code;
      saveAppState();
      renderAccentPills();
      renderVoiceOptions();
      renderActiveMode();
    }

    function renderVoiceOptions() {
      const sel = document.getElementById('voiceSelect');
      const hint = document.getElementById('voiceHint');
      if (!sel) return;

      const all = getEnglishVoices();
      const exact = all.filter(v => normalizeLang(v.lang) === normalizeLang(state.accent));
      const accentLabel = ACCENTS[state.accent] ? ACCENTS[state.accent].label : '';

      if (!exact.length) {
        // 이 기기에 해당 억양 음성 팩이 없는 경우 → 기본 영어 음성으로 자동 대체
        sel.innerHTML = '<option value="">기본 영어 음성 (억양 팩 없음)</option>';
        sel.disabled = true;
        if (hint) {
          hint.textContent = all.length
            ? `이 기기에는 ${accentLabel} 음성 팩이 없어 기본 영어 음성으로 재생됩니다.`
            : `이 브라우저에서는 기기 음성 목록을 불러오지 못했습니다. 기본 음성으로 재생됩니다.`;
          hint.classList.remove('hidden');
        }
        return;
      }

      sel.disabled = false;
      const chosen = pickVoiceForAccent(state.accent, all);
      sel.innerHTML = exact.map(v =>
        `<option value="${escapeHtml(v.voiceURI)}"${chosen && v.voiceURI === chosen.voiceURI ? ' selected' : ''}>${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`
      ).join('');
      if (chosen) sel.value = chosen.voiceURI;
      if (hint) hint.classList.add('hidden');
    }

    function onVoiceChange(uri) {
      if (!state.voiceByAccent) state.voiceByAccent = {};
      if (uri) state.voiceByAccent[state.accent] = uri;
      else delete state.voiceByAccent[state.accent];
      saveAppState();
      previewAccent();
    }

    function previewAccent() {
      stopRepeatPlayback();
      speakText('Could I get a coffee, please?', state.speed);
    }

    function playSingleTTS(id, rate = null, accent = null) {
      stopRepeatPlayback();
      const item = SENTENCES.find(s => s.id === id);
      if (!item) return;
      markStudied(item.id);
      speakText(item.en, rate == null ? state.speed : Number(rate), null, accent);
    }

    // 반복 단계별 재생 속도 (믹스: 처음 2회 0.85x → 이후 1.0x / 듣기속도: 고른 속도 그대로)
    function repeatRateForStep(step) {
      const pace = REPEAT_PACES[state.repeatPace] || REPEAT_PACES.mix;
      if (pace.speedBased) return state.speed;
      return step <= pace.warmup ? pace.slowRate : 1.0;
    }

    // 속도 라벨은 항상 소수 한 자리 (0.8x / 1.0x / 1.2x)
    function formatSpeed(value = state.speed) {
      return `${Number(value).toFixed(1)}x`;
    }

    function renderRepeatDots(completed, total = repeatState.times || REPEAT_TIMES) {
      const box = document.getElementById('repeatDots');
      if (!box) return;
      const count = Math.max(1, Math.min(20, Number(total) || REPEAT_TIMES));
      box.innerHTML = Array.from({ length: count }, (_, i) =>
        `<span class="inline-block w-1.5 h-1.5 rounded-full ${i < completed ? 'bg-emerald-400' : 'bg-slate-600'}"></span>`
      ).join('');
    }

    function renderSpeedPills() {
      const box = document.getElementById('speedPills');
      if (!box) return;
      box.innerHTML = Object.keys(REPEAT_PACES).map(key => {
        const pace = REPEAT_PACES[key];
        const label = key === 'steady' ? `내 속도 ${formatSpeed()}` : pace.label;
        const active = (state.repeatPace || 'mix') === key;
        return `
          <button type="button" onclick="setRepeatPace('${key}')" aria-pressed="${active}"
            class="px-0.5 py-1 rounded-lg border text-[10px] font-extrabold whitespace-nowrap transition active:scale-95 ${
              active
                ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'
            }">
            ${label}
          </button>
        `;
      }).join('');
    }

    function setRepeatPace(key) {
      if (!REPEAT_PACES[key]) return;
      state.repeatPace = key;
      saveAppState();
      renderSpeedPills();
      if (repeatState.active) {
        const statusEl = document.getElementById('repeatStatusText');
        if (statusEl) statusEl.textContent = `🔁 속도 변경: ${key === 'steady' ? `내 속도 ${formatSpeed()}` : REPEAT_PACES[key].label}`;
      }
    }

    // ---------- 문장별 듣기 속도(5단계) · 억양(4개국) 버튼 ----------
    // 속도 알약을 탭하면 그 속도를 기본값으로 저장하고 이 문장을 바로 그 속도로 들려준다
    function setSpeed(rate, playId = null) {
      const r = Number(rate);
      if (SPEEDS.indexOf(r) < 0) return;
      const changed = state.speed !== r;
      state.speed = r;
      if (changed) {
        saveAppState();
        renderSpeedPills();
        renderActiveMode();
      }
      if (playId != null) playSingleTTS(playId);
    }

    function renderSpeedMiniButtons(id) {
      return SPEEDS.map(rate => {
        const active = Math.abs(state.speed - rate) < 0.001;
        const label = `${rate.toFixed(1)}x`;
        return `
          <button type="button" onclick="setSpeed(${rate}, ${id})" aria-label="이 문장을 ${label} 속도로 듣기" aria-pressed="${active}"
            class="py-1.5 rounded-lg border text-[10px] font-extrabold transition active:scale-95 ${
              active
                ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                : 'bg-slate-50 dark:bg-slate-700/60 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300'
            }">${label}</button>
        `;
      }).join('');
    }

    function renderAccentMiniButtons(id) {
      return ACCENT_ORDER.map(code => {
        const a = ACCENTS[code];
        const active = state.accent === code;
        return `
          <button type="button" onclick="playInAccent(${id}, '${code}')" aria-label="이 문장을 ${a.label} 억양으로 듣기" aria-pressed="${active}"
            class="min-w-0 flex-1 py-1.5 px-0.5 rounded-lg border text-[10px] font-extrabold flex items-center justify-center gap-0.5 transition active:scale-95 ${
              active
                ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                : 'bg-slate-50 dark:bg-slate-700/60 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300'
            }">
            <span class="text-[12px] leading-none">${a.flag}</span><span class="accent-label">${a.label}</span>
          </button>
        `;
      }).join('');
    }

    // 카드에서 억양을 탭하면 그 억양을 선택 상태로 저장하고 이 문장을 바로 재생 (헤더까지 올라갈 필요 없음)
    function playInAccent(id, code) {
      if (!ACCENTS[code]) return;
      if (state.accent !== code) setAccent(code);
      playSingleTTS(id);
    }

    // 문장 카드의 3회·5회·10회 반복 버튼 (반복 속도는 믹스 / 내 속도 규칙을 그대로 따른다)
    // 그 문장이 지금 이 횟수로 반복 중이면 버튼이 '⏹️ 멈춤'으로 바뀐다.
    function renderRepeatMiniButtons(id, activeTimes = 0) {
      return REPEAT_CHOICES.map(times => {
        const active = Number(activeTimes) === times;
        const label = active ? '이 문장 ' + times + '회 반복 멈춤' : '이 문장 ' + times + '회 반복';
        return `
          <button type="button" onclick="startRepeatN(${id}, ${times})" aria-label="${label}" aria-pressed="${active}"
            class="py-1.5 px-0.5 rounded-lg ${
              active
                ? 'bg-rose-600 text-white'
                : (times === 3 ? 'bg-indigo-500/90 hover:bg-indigo-700 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white')
            } text-[10px] font-extrabold flex items-center justify-center gap-0.5 shadow-sm active:scale-95 transition whitespace-nowrap">
            <span>${active ? '⏹️' : '🔁'}</span><span>${active ? '멈춤' : times + '회'}</span>
          </button>
        `;
      }).join('');
    }

    function startRepeatN(id, times = REPEAT_TIMES) {
      const item = SENTENCES.find(s => s.id === id);
      if (!item) return;
      const reps = Math.max(1, Math.min(20, Number(times) || REPEAT_TIMES));

      if (repeatState.active && !repeatState.loop && repeatState.sentenceId === id && repeatState.times === reps) {
        stopRepeatPlayback();
        return;
      }

      stopRepeatPlayback();
      repeatState.active = true;
      repeatState.loop = false;
      repeatState.sentenceId = id;
      repeatState.step = 1;
      repeatState.times = reps;

      const bar = document.getElementById('repeatFloatingBar');
      bar.classList.remove('hidden');
      document.getElementById('repeatSentenceText').textContent = item.en;
      renderRepeatDots(0, reps);
      markStudied(item.id);

      runRepeatStep(item);
      if (state.mode === 'list') renderListMode();
      else if (state.mode === 'flash') renderFlashMode();
    }

    function startRepeat5x(id) { startRepeatN(id, 5); }
    function startRepeat10x(id) { startRepeatN(id, 10); }
    function startRepeat3x(id) { startRepeatN(id, 3); }

    function runRepeatStep(item) {
      if (!repeatState.active || repeatState.sentenceId !== item.id) return;
      const step = repeatState.step;
      const looping = Boolean(repeatState.loop);
      const times = looping ? null : (repeatState.times || REPEAT_TIMES);
      const rate = repeatRateForStep(step);
      const statusEl = document.getElementById('repeatStatusText');
      const accent = ACCENTS[state.accent] || ACCENTS['en-US'];
      statusEl.textContent = looping
        ? `🔁 연속 반복 중 (${step}회째 · ${rate}x ${accent.flag})`
        : `🔊 ${accent.flag} 발음 (${step}/${times}회 · ${rate}x)`;

      speakText(item.en, rate, () => {
        if (!repeatState.active || repeatState.sentenceId !== item.id) return;
        if (looping) {
          renderRepeatDots(((step - 1) % LOOP_DOTS) + 1, LOOP_DOTS);
          repeatState.timerId = setTimeout(() => {
            if (!repeatState.active || repeatState.sentenceId !== item.id) return;
            repeatState.step = step + 1;
            runRepeatStep(item);
          }, REPEAT_GAP_MS);
          return;
        }
        renderRepeatDots(step, times);
        if (step >= times) {
          statusEl.textContent = `🎉 ${times}회 반복 청취 완료!`;
          burstConfetti(12);
          repeatState.timerId = setTimeout(() => stopRepeatPlayback(), 1400);
          return;
        }
        statusEl.textContent = `🗣️ 따라 말해보세요! (${step}/${times}회 완료)`;
        repeatState.timerId = setTimeout(() => {
          if (!repeatState.active || repeatState.sentenceId !== item.id) return;
          repeatState.step = step + 1;
          runRepeatStep(item);
        }, REPEAT_GAP_MS);
      });
    }

    // =========================================================================
    // 자동 연속재생 (필터된 목록을 문장마다 N회씩 읽고 자동으로 다음 문장으로)
    // =========================================================================
    function currentPlayingId() {
      if (repeatState.active) return repeatState.sentenceId;
      if (autoState.active && autoState.items[autoState.index]) return autoState.items[autoState.index].id;
      return null;
    }

    function startAutoPlay(reps = 5) {
      const items = getFilteredSentences();
      if (!items.length) {
        showModal('연속재생 안내', '지금 조건에 맞는 문장이 없습니다. 챕터나 검색 조건을 먼저 바꿔 주세요.');
        return;
      }
      stopRepeatPlayback();
      const r = Math.max(1, Math.min(10, Number(reps) || 5));
      const startIdx = Math.max(0, Math.min(items.length - 1, (state.currentPage - 1) * PAGE_SIZE));
      autoState = { active: true, items, index: startIdx, step: 1, reps: r, timerId: null };

      document.getElementById('repeatFloatingBar').classList.remove('hidden');
      renderRepeatDots(0, r);
      runAutoStep();
      if (state.mode === 'list') renderListMode();
    }

    // =========================================================================
    // 문장별 '연속재생' — 그 문장 하나만 멈출 때까지 계속 반복 (다음 문장으로 넘어가지 않는다)
    // =========================================================================
    function startSingleLoop(id) {
      const item = SENTENCES.find(s => s.id === id);
      if (!item) return;

      // 지금 이 문장을 연속재생 중이면 다시 누를 때 멈춘다
      if (repeatState.active && repeatState.loop && repeatState.sentenceId === id) {
        stopRepeatPlayback();
        return;
      }

      stopRepeatPlayback();
      repeatState.active = true;
      repeatState.loop = true;
      repeatState.sentenceId = id;
      repeatState.step = 1;
      repeatState.times = Infinity;

      const bar = document.getElementById('repeatFloatingBar');
      bar.classList.remove('hidden');
      document.getElementById('repeatSentenceText').textContent = item.en;
      renderRepeatDots(1, LOOP_DOTS);
      markStudied(item.id);

      runRepeatStep(item);
      if (state.mode === 'list') renderListMode();
      else if (state.mode === 'flash') renderFlashMode();
    }

    function runAutoStep() {
      if (!autoState.active) return;
      const item = autoState.items[autoState.index];
      const total = autoState.items.length;
      if (!item) { finishAutoPlay(); return; }

      const statusEl = document.getElementById('repeatStatusText');
      const rate = repeatRateForStep(autoState.step);
      const accent = ACCENTS[state.accent] || ACCENTS['en-US'];

      // 다음 페이지 문장으로 넘어가면 리스트도 따라 이동
      if (state.mode === 'list') {
        const pageOfIdx = Math.floor(autoState.index / PAGE_SIZE) + 1;
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (state.currentPage !== Math.min(pageOfIdx, totalPages)) {
          state.currentPage = Math.min(pageOfIdx, totalPages);
          renderListMode();
        }
      }

      document.getElementById('repeatSentenceText').textContent = item.en;
      statusEl.textContent = `🔁 연속재생 ${autoState.index + 1}/${total}문장 · ${autoState.step}/${autoState.reps}회 · ${rate}x ${accent.flag}`;
      markStudied(item.id);

      speakText(item.en, rate, () => {
        if (!autoState.active) return;
        renderRepeatDots(autoState.step, autoState.reps);
        if (autoState.step >= autoState.reps) {
          autoState.index += 1;
          autoState.step = 1;
          if (autoState.index >= autoState.items.length) { finishAutoPlay(); return; }
          autoState.timerId = setTimeout(() => {
            if (!autoState.active) return;
            renderRepeatDots(0, autoState.reps);
            runAutoStep();
          }, 650);
          return;
        }
        autoState.step += 1;
        autoState.timerId = setTimeout(() => {
          if (!autoState.active) return;
          runAutoStep();
        }, Math.round(REPEAT_GAP_MS * 0.7));
      });
    }

    function stopAutoPlay() {
      autoState.active = false;
      if (autoState.timerId) {
        clearTimeout(autoState.timerId);
        autoState.timerId = null;
      }
    }

    function finishAutoPlay() {
      const played = autoState.items.length;
      stopAutoPlay();
      showCelebrate(`연속재생 완료! ${played}문장`, '🏁');
      burstConfetti(18);
      stopRepeatPlayback();
    }

    function stopRepeatPlayback() {
      const wasPlaying = repeatState.active || autoState.active;
      stopAutoPlay();
      if (repeatState.timerId) {
        clearTimeout(repeatState.timerId);
        repeatState.timerId = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      repeatState.active = false;
      repeatState.sentenceId = null;
      repeatState.step = 0;
      repeatState.loop = false;
      document.getElementById('repeatFloatingBar').classList.add('hidden');
      if (wasPlaying && state.mode === 'list') renderListMode();
      else if (wasPlaying && state.mode === 'flash') renderFlashMode();
    }

    // =========================================================================
    // 6. 사용자 액션 핸들러 (암기/즐겨찾기/필터/탭)
    // =========================================================================
    function toggleMemorized(id) {
      if (state.memorized[id]) {
        delete state.memorized[id];
      } else {
        state.memorized[id] = true;
        markStudied(id);
      }
      saveAppState();
      updateDashboardStats();
      renderActiveMode();
    }

    function toggleStarred(id) {
      if (state.starred[id]) {
        delete state.starred[id];
      } else {
        state.starred[id] = true;
      }
      saveAppState();
      updateDashboardStats();
      renderActiveMode();
    }

    // 🔥 Hard: 어려운 문장 표시 (리스트 카드·플래시카드 어디서든 토글)
    function toggleHard(id) {
      if (state.difficult[id]) {
        delete state.difficult[id];
      } else {
        state.difficult[id] = true;
      }
      saveAppState();
      updateDashboardStats();
      renderActiveMode();
    }

    function onCategoryChange(cat) {
      stopRepeatPlayback();
      state.category = cat;
      state.currentPage = 1;
      state.flashIndex = 0;
      state.flashFlipped = false;
      state.flashDeckOrder = null;
      document.getElementById('categorySelect').value = cat;
      renderChapterPills();
      saveAppState();
      if (state.mode === 'quiz') initQuiz();
      else renderActiveMode();
    }

    function onSearchInput(val) {
      state.searchQuery = val;
      state.currentPage = 1;
      state.flashIndex = 0;
      state.flashFlipped = false;
      state.flashDeckOrder = null;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !val);
      if (state.mode === 'quiz') initQuiz();
      else renderActiveMode();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      onSearchInput('');
    }

    function setStatusFilter(filter) {
      state.statusFilter = filter;
      state.currentPage = 1;
      state.flashIndex = 0;
      state.flashFlipped = false;
      state.flashDeckOrder = null;
      renderStatusFilterButtons();
      if (state.mode === 'quiz') initQuiz();
      else renderActiveMode();
    }

    function toggleHideEnglish() {
      state.hideEnglish = !state.hideEnglish;
      const btn = document.getElementById('hideEnglishToggle');
      const icon = document.getElementById('hideEnglishIcon');
      const label = document.getElementById('hideEnglishLabel');
      if (state.hideEnglish) {
        btn.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border border-indigo-600 bg-indigo-600 text-white active:scale-95 transition';
        icon.textContent = '👁️';
        label.textContent = '영어 다시보기';
      } else {
        btn.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 active:scale-95 transition';
        icon.textContent = '🙈';
        label.textContent = '한국어만 보기';
      }
      renderActiveMode();
    }

    function switchMode(mode) {
      stopRepeatPlayback();
      state.mode = mode;
      saveAppState();
      renderModeTabs();
      if (mode === 'quiz') {
        initQuiz();
      } else {
        renderActiveMode();
      }
    }

    function toggleInstallGuide() {
      document.getElementById('installGuideBody').classList.toggle('hidden');
    }

    // =========================================================================
    // 7. 상단 UI 및 탭 렌더링
    // =========================================================================
    function updateDashboardStats() {
      const total = SENTENCES.length;
      const memCount = Object.keys(state.memorized).length;
      const starCount = Object.keys(state.starred).length;
      const hardCount = Object.keys(state.difficult || {}).length;
      const pct = Math.round((memCount / total) * 100);

      document.getElementById('statMemorized').textContent = memCount;
      const totalEl = document.getElementById('statTotal');
      if (totalEl) totalEl.textContent = total;
      document.getElementById('statStarred').textContent = starCount;
      const hardEl = document.getElementById('statDifficult');
      if (hardEl) hardEl.textContent = hardCount;
      document.getElementById('statPercent').textContent = `${pct}%`;
      document.getElementById('statProgressBar').style.width = `${pct}%`;
    }

    // 챕터 드롭다운을 실제 데이터 개수로 생성 (문장 수가 바뀌어도 라벨이 어긋나지 않게)
    function renderCategoryOptions() {
      const sel = document.getElementById('categorySelect');
      if (!sel) return;
      const counts = {};
      SENTENCES.forEach(s => { counts[s.category] = (counts[s.category] || 0) + 1; });
      sel.innerHTML = [
        `<option value="all">📚 전체 챕터 보기 (${SENTENCES.length}문장)</option>`,
        ...CHAPTER_META.filter(ch => ch.id !== 'all').map(ch =>
          `<option value="${ch.id}">${ch.title} (${counts[ch.id] || 0}문장)</option>`
        )
      ].join('');
    }

    function renderModeTabs() {
      ['list', 'flash', 'quiz'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (state.mode === m) {
          btn.className = 'py-2 px-2 rounded-lg text-xs font-extrabold transition-all flex items-center justify-center gap-1 bg-indigo-600 text-white shadow-sm';
        } else {
          btn.className = 'py-2 px-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 text-slate-600 dark:text-slate-300 hover:bg-white/60 dark:hover:bg-slate-700/60';
        }
      });
    }

    function renderChapterPills() {
      const container = document.getElementById('chapterPills');
      container.innerHTML = CHAPTER_META.map(ch => {
        const active = state.category === ch.id;
        return `
          <button onclick="onCategoryChange('${ch.id}')"
            class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold border transition ${
              active
                ? 'bg-slate-900 dark:bg-indigo-600 text-white border-slate-900 dark:border-indigo-600'
                : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
            }">
            ${ch.short}
          </button>
        `;
      }).join('');
    }

    function renderStatusFilterButtons() {
      const map = {
        all: '전체',
        unmemorized: '미암기만',
        memorized: '암기완료',
        starred: '★ 즐겨찾기',
        hard: '🔥 Hard'
      };
      Object.keys(map).forEach(key => {
        const btn = document.getElementById(`filter-${key}`);
        const active = state.statusFilter === key;
        btn.textContent = map[key];
        if (active) {
          btn.className = 'status-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border transition whitespace-nowrap bg-indigo-50 dark:bg-indigo-950 border-indigo-500 text-indigo-700 dark:text-indigo-300';
        } else {
          btn.className = 'status-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition whitespace-nowrap bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300';
        }
      });
    }

    function renderActiveMode() {
      updateFilterVisibility();
      if (state.mode === 'list') renderListMode();
      else if (state.mode === 'flash') renderFlashMode();
      else if (state.mode === 'quiz') renderQuizMode();
    }

    // 검색·상태 필터는 리스트 모드에서만 노출 (플래시카드·퀴즈는 카드 영역을 넓게)
    function updateFilterVisibility() {
      const box = document.getElementById('listOnlyFilters');
      if (!box) return;
      const filtering = Boolean(state.searchQuery.trim()) || state.statusFilter !== 'all';
      box.classList.toggle('hidden', state.mode !== 'list' && !filtering);
    }

    // =========================================================================
    // 8. [모드 1] 카드 리스트 모드 (20개 페이지네이션 + TTS + 리듬강세)
    // =========================================================================
    function renderListMode() {
      const main = document.getElementById('mainContent');
      const filtered = getFilteredSentences();
      const totalItems = filtered.length;

      if (totalItems === 0) {
        main.innerHTML = renderEmptyState();
        return;
      }

      const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
      if (state.currentPage > totalPages) state.currentPage = totalPages;
      const startIdx = (state.currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

      const cardsHtml = pageItems.map(item => {
        const isMem = Boolean(state.memorized[item.id]);
        const isStar = Boolean(state.starred[item.id]);
        const isHard = Boolean(state.difficult[item.id]);
        const isRepeating = currentPlayingId() === item.id;
        const repeatTimesHere = (repeatState.active && !repeatState.loop && repeatState.sentenceId === item.id) ? repeatState.times : 0;
        const isLoopHere = Boolean(repeatState.active && repeatState.loop && repeatState.sentenceId === item.id);
        return `
          <article class="bg-white dark:bg-slate-800 rounded-2xl border ${
            isRepeating
              ? 'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900'
              : isMem
              ? 'border-emerald-300/80 dark:border-emerald-800'
              : 'border-slate-200/90 dark:border-slate-700/80'
          } p-4 shadow-sm transition-all">
            <!-- 상단: 번호, 소리블록 배지, Hard·즐겨찾기·암기완료 버튼 -->
            <div class="flex items-center justify-between gap-1.5 flex-wrap mb-2.5">
              <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                <span class="text-xs font-extrabold text-slate-400 dark:text-slate-500">#${item.id}</span>
                <span class="px-2 py-0.5 rounded-md text-[11px] font-extrabold bg-indigo-50 dark:bg-indigo-950/90 text-indigo-700 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900">
                  ${item.tag}
                </span>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <!-- Hard(어려움) 표시 버튼 -->
                <button onclick="toggleHard(${item.id})" aria-label="Hard 표시 (어려운 문장)" aria-pressed="${isHard}"
                  class="px-2 py-1 rounded-xl text-[11px] font-extrabold border transition active:scale-90 flex items-center gap-0.5 ${
                    isHard
                      ? 'bg-rose-50 dark:bg-rose-950/60 border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-300'
                      : 'bg-slate-50 dark:bg-slate-700/60 border-slate-200 dark:border-slate-600 text-slate-400'
                  }">
                  <span>🔥</span><span>Hard</span>
                </button>
                <!-- 즐겨찾기 버튼 -->
                <button onclick="toggleStarred(${item.id})" aria-label="즐겨찾기"
                  class="px-2.5 py-1 rounded-xl text-xs font-extrabold border transition active:scale-90 ${
                    isStar
                      ? 'bg-amber-50 dark:bg-amber-950/60 border-amber-300 dark:border-amber-700 text-amber-500'
                      : 'bg-slate-50 dark:bg-slate-700/60 border-slate-200 dark:border-slate-600 text-slate-400'
                  }">
                  ${isStar ? '★' : '☆'}
                </button>
                <!-- 암기 완료 체크 버튼 -->
                <button onclick="toggleMemorized(${item.id})" aria-label="암기 완료 체크"
                  class="px-2 py-1 rounded-xl text-[11px] font-extrabold border transition active:scale-90 flex items-center gap-1 ${
                    isMem
                      ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm'
                      : 'bg-white dark:bg-slate-700/60 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300'
                  }">
                  <span>${isMem ? '✓ 암기완료' : '○ 암기체크'}</span>
                </button>
              </div>
            </div>

            <!-- 한국어 해석 -->
            <p class="text-sm font-bold text-slate-800 dark:text-slate-100 mb-2 leading-snug">
              ${item.ko}
            </p>

            <!-- 영어 원문 & 원어민 리듬/강세 가이드 박스 -->
            <div class="rounded-xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200/70 dark:border-slate-700/70 p-3 mb-3 relative">
              <div class="${state.hideEnglish ? 'invisible select-none' : ''} transition-all">
                <p class="font-en text-[16px] font-extrabold text-slate-900 dark:text-white leading-snug mb-1.5">
                  ${item.en}
                </p>
                <div class="text-xs font-en leading-relaxed pt-1.5 border-t border-slate-200/60 dark:border-slate-800">
                  <span class="text-[10px] font-bold text-slate-400 mr-1">리듬강세:</span>
                  ${formatRhythmHighlight(item.en)}
                </div>
              </div>
              ${state.hideEnglish ? `
                <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 rounded-xl bg-slate-50 dark:bg-slate-900 px-2 text-center">
                  ${(state.hintedIds && state.hintedIds[item.id])
                    ? `<p class="font-en text-[15px] font-extrabold text-amber-600 dark:text-amber-300 leading-snug">${buildHintSentence(item.en)}</p>`
                    : `<p class="text-[11px] font-bold text-slate-500 dark:text-slate-400">한국어를 보고 영어로 말해보세요</p>`}
                  <div class="flex items-center justify-center gap-1.5">
                    <button onclick="toggleHint(${item.id})"
                      class="px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold border transition active:scale-95 ${
                        (state.hintedIds && state.hintedIds[item.id])
                          ? 'bg-amber-100 dark:bg-amber-950/70 border-amber-300 dark:border-amber-800 text-amber-700 dark:text-amber-300'
                          : 'bg-white dark:bg-slate-800 border-amber-200 dark:border-amber-900 text-amber-600 dark:text-amber-400'
                      }">
                      💡 ${(state.hintedIds && state.hintedIds[item.id]) ? '힌트 숨기기' : '힌트'}
                    </button>
                    <button onclick="toggleHideEnglish()"

        `;
      }).join('');

      // 페이지네이션 컨트롤 바
      const paginationHtml = `

    // =========================================================================
    // 9. [모드 2] 플래시카드 모드 (스와이프 + 앞/뒷면 전환 + 셔플 + 자동 TTS)
    // =========================================================================
    function getFlashDeck() {
      const filtered = getFilteredSentences();
      if (!state.flashDeckOrder) return filtered;
      const map = new Map(filtered.map(item => [item.id, item]));
      const ordered = state.flashDeckOrder.map(id => map.get(id)).filter(Boolean);
      return ordered.length === filtered.length ? ordered : filtered;
    }

    function renderFlashMode() {
      const main = document.getElementById('mainContent');
      const deck = getFlashDeck();

      if (deck.length === 0) {
        main.innerHTML = renderEmptyState();
        return;

      if (state.flashIndex < 0) state.flashIndex = deck.length - 1;

      const isStar = Boolean(state.starred[card.id]);

      main.innerHTML = `

            <div class="my-auto py-4 text-center">
              ${!state.flashFlipped ? `

                <div class="text-xs font-en bg-white/90 dark:bg-slate-900/80 rounded-xl p-2.5 border border-indigo-100 dark:border-slate-700">

            <div class="text-center text-[11px] font-bold text-slate-400">
              👆 카드를 터치하면 ${state.flashFlipped ? '앞면(한국어)' : '뒷면(영어 + 자동발음)'}으로 전환됩니다

          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="playSingleTTS(${card.id})" aria-label="지금 듣기 속도로 재생"
              class="py-3 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-extrabold text-slate-800 dark:text-slate-100 active:scale-95 transition">
              🔊 듣기 ${formatSpeed()}
            </button>
            <button onclick="setSpeed(0.8, ${card.id})" aria-label="0.8배속 느리게 듣기" aria-pressed="${Math.abs(state.speed - 0.8) < 0.001}"
              class="py-3 rounded-2xl border text-xs font-extrabold active:scale-95 transition ${
                Math.abs(state.speed - 0.8) < 0.001
                  ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100'
              }">
              🐢 느리게 0.8x
            </button>

                  ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm'
                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100'

          <!-- 듣기 속도 5단계 + 이 문장 4개국 억양 -->
          <div class="space-y-1.5">
            <div class="grid grid-cols-5 gap-1" role="group" aria-label="듣기 속도 5단계 (0.8x·0.9x·1.0x·1.1x·1.2x)">

            </div>
            <div class="flex items-center gap-1" role="group" aria-label="이 문장 억양 선택 (미국·영국·호주·인도)">

            </div>
          </div>

          <!-- 3회·5회·10회 반복 + 이 문장 연속재생(무한 반복) -->
          <div class="grid grid-cols-3 gap-1.5">
            ${REPEAT_CHOICES.map(times => {
              const on = Boolean(repeatState.active && !repeatState.loop && repeatState.sentenceId === card.id && repeatState.times === times);
              return `
                <button onclick="startRepeatN(${card.id}, ${times})" aria-label="${on ? '이 문장 ' + times + '회 반복 멈춤' : '이 문장 ' + times + '회 반복'}" aria-pressed="${on}"
                  class="py-3 rounded-2xl ${
                    on ? 'bg-rose-600 text-white' : (times === 3 ? 'bg-indigo-500/90 text-white' : 'bg-indigo-600 text-white')
                  } text-xs font-extrabold shadow-sm active:scale-95 transition whitespace-nowrap">
                  ${on ? '⏹️ ' + times + '회 멈춤' : '🔁 ' + times + '회 반복'}
                </button>
              `;
            }).join('')}
          </div>
          <button onclick="startSingleLoop(${card.id})" aria-label="${isLooping ? '이 문장 연속재생 멈춤' : '이 문장 연속재생 (멈출 때까지 무한 반복)'}" aria-pressed="${isLooping}"
            class="w-full py-3 rounded-2xl ${
              isLooping ? 'bg-rose-600 text-white' : 'bg-slate-900 dark:bg-slate-700 text-white'
            } text-xs font-extrabold shadow-sm active:scale-95 transition">
            ${isLooping ? '⏹️ 멈춤' : '🔁 연속재생'}
          </button>

          <!-- 별표 · Hard · 외웠어요 -->
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="toggleStarred(${card.id})" class="py-3 rounded-2xl border text-xs font-extrabold active:scale-95 transition ${
              isStar
                ? 'bg-amber-50 dark:bg-amber-950/60 border-amber-300 text-amber-500'
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'
            }">
              ${isStar ? '★ 별표됨' : '☆ 별표'}
            </button>
            <button onclick="toggleHard(${card.id})" aria-pressed="${isHard}" class="py-3 rounded-2xl border text-xs font-extrabold active:scale-95 transition ${
              isHard
                ? 'bg-rose-50 dark:bg-rose-950/60 border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-300'
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'
            }">
              🔥 Hard
            </button>
            <button onclick="markFlashMemorized(${card.id})" class="py-3 rounded-2xl text-xs font-extrabold active:scale-95 transition ${
              isMem
                ? 'bg-emerald-500 text-white shadow-sm'
                : 'bg-indigo-600 text-white shadow-sm'
            }">
              ${isMem ? '✓ 외웠어요' : '외웠어요 ✓'}
            </button>
          </div>

          <!-- 이전 / 다음 큰 터치 네비게이션 -->
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button onclick="moveFlashCard(-1)" class="py-3.5 rounded-2xl bg-slate-200/80 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm font-extrabold active:scale-95 transition">
              ◀ 이전 카드
            </button>
            <button onclick="moveFlashCard(1)" class="py-3.5 rounded-2xl bg-slate-900 dark:bg-indigo-600 text-white text-sm font-extrabold active:scale-95 transition">

            </button>
          </div>
        </div>
      `;

      attachFlashSwipeEvents();
    }

    function flipFlashCard() {
      const deck = getFlashDeck();
      if (!deck.length) return;
      state.flashFlipped = !state.flashFlipped;
      if (state.flashFlipped) state.flashHint = false;
      renderFlashMode();
      if (state.flashFlipped) {
        const card = deck[state.flashIndex];
        markStudied(card.id);
        speakText(card.en, state.speed);
      }
    }

    function moveFlashCard(delta) {
      const deck = getFlashDeck();
      if (!deck.length) return;
      state.flashIndex = (state.flashIndex + delta + deck.length) % deck.length;
      state.flashFlipped = false;
      state.flashHint = false;
      saveAppState();
      renderFlashMode();
    }

    function markFlashMemorized(id) {
      toggleMemorized(id);
      // 외웠어요 체크 후 자동으로 다음 카드로 넘어가면 학습 흐름이 매우 쾌적함
      if (state.memorized[id]) {
        setTimeout(() => moveFlashCard(1), 250);
      }
    }

    function shuffleFlashDeck() {
      const filtered = getFilteredSentences();
      const ids = filtered.map(s => s.id);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      state.flashDeckOrder = ids;
      state.flashIndex = 0;
      state.flashFlipped = false;
      state.flashHint = false;
      renderFlashMode();
    }

    function attachFlashSwipeEvents() {
      const box = document.getElementById('flashCardBox');
      if (!box) return;
      let startX = 0;
      box.addEventListener('touchstart', e => {
        startX = e.changedTouches[0].clientX;
      }, { passive: true });
      box.addEventListener('touchend', e => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (Math.abs(diffX) > 55) {
          e.stopPropagation();
          moveFlashCard(diffX < 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    // =========================================================================
    // 10. [모드 3] 실전 스피킹 & 퀴즈 모드 (4지선다 + 어순 배열 블록 조립)
    // =========================================================================
    function initQuiz(customPool = null) {
      const pool = customPool || getFilteredSentences();
      if (pool.length === 0) {
        document.getElementById('mainContent').innerHTML = renderEmptyState();
        return;
      }

      // 최대 10문제 출제
      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
      quizState.questions = shuffled;
      quizState.currentIdx = 0;
      quizState.score = 0;
      quizState.combo = 0;
      quizState.wrongList = [];
      quizState.finished = false;
      prepareCurrentQuestion();
      renderQuizMode();
    }

    function switchQuizType(type) {
      quizState.type = type;
      initQuiz();
    }

    // 보기 비교용 정규화: 대소문자·구두점·공백 차이로 같은 문장이 두 번 나오는 걸 막는다 (한글도 유지)
    function normalizeChoiceText(text) {
      return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    }

    // 오답 보기 추출: 정답과 영어 문장 또는 한국어 뜻이 겹치는 문장은 제외 (중복 보기 방지)
    function pickDistractors(q, count = 3) {
      const usedEn = new Set([normalizeChoiceText(q.en)]);
      const usedKo = new Set([normalizeChoiceText(q.ko)]);
      const picked = [];
      const pools = [
        getFilteredSentences().filter(s => s.id !== q.id), // 지금 고른 챕터 안에서 먼저
        SENTENCES.filter(s => s.id !== q.id)               // 부족하면 전체 문장에서
      ];

      for (const pool of pools) {
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        for (const cand of shuffled) {
          if (picked.length >= count) break;
          const enKey = normalizeChoiceText(cand.en);
          const koKey = normalizeChoiceText(cand.ko);
          if (usedEn.has(enKey) || usedKo.has(koKey)) continue;
          usedEn.add(enKey);
          usedKo.add(koKey);
          picked.push(cand);
        }
        if (picked.length >= count) break;
      }
      return picked;
    }

    function prepareCurrentQuestion() {
      const q = quizState.questions[quizState.currentIdx];
      quizState.answered = false;
      quizState.selectedOption = null;

      if (quizState.type === 'choice') {
        // 오답 보기 3개 추출 (정답/이전 보기와 중복되는 문장은 제외)
        const distractors = pickDistractors(q, 3);
        quizState.options = [q, ...distractors].sort(() => Math.random() - 0.5);
      } else {
        // 어순 배열: 문장을 단어 단위로 분리 후 섞기
        const words = q.en.split(' ');
        quizState.orderedWords = [];
        quizState.availableWords = words
          .map((w, idx) => ({ id: idx, word: w }))
          .sort(() => Math.random() - 0.5);
      }
    }

    function renderQuizMode() {
      const main = document.getElementById('mainContent');
      if (!quizState.questions.length) {
        main.innerHTML = renderEmptyState();
        return;
      }

      // 결과 화면
      if (quizState.finished) {
        const total = quizState.questions.length;
        const pct = Math.round((quizState.score / total) * 100);
        main.innerHTML = `
          <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 text-center shadow-sm space-y-4">
            <div class="text-4xl">${pct >= 80 ? '🏆' : '💪'}</div>
            <div>
              <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">실전 테스트 완료!</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">총 ${total}문제 중 <strong class="text-indigo-600 dark:text-indigo-400">${quizState.score}문제</strong> 정답 (${pct}점)</p>
            </div>

            ${quizState.wrongList.length > 0 ? `
              <div class="text-left bg-rose-50/70 dark:bg-rose-950/30 rounded-2xl p-3.5 border border-rose-200/80 dark:border-rose-900 space-y-2.5">
                <p class="text-xs font-extrabold text-rose-700 dark:text-rose-300">📌 오답 즉시 복습 (${quizState.wrongList.length}문장)</p>
                ${quizState.wrongList.map(w => `
                  <div class="bg-white dark:bg-slate-800 rounded-xl p-2.5 border border-rose-100 dark:border-slate-700">
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-200">${w.ko}</p>
                    <p class="font-en text-xs font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5">${w.en}</p>
                    <button onclick="playSingleTTS(${w.id})" class="mt-1.5 text-[11px] font-bold text-slate-500 hover:text-indigo-600">🔊 발음 듣기</button>
                  </div>
                `).join('')}
              </div>
              <button onclick="retryWrongQuestions()" class="w-full py-3 rounded-2xl bg-rose-600 text-white text-xs font-extrabold shadow-sm active:scale-95 transition">
                틀린 문제만 다시 풀기 (${quizState.wrongList.length}문제)
              </button>
            ` : `
              <div class="bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 text-xs font-bold p-3 rounded-2xl">
                완벽합니다! 모든 문장을 정확히 맞히셨어요 🎉
              </div>
            `}

            <button onclick="initQuiz()" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold shadow-sm active:scale-95 transition">
              새 문제 세트 시작하기 ↻
            </button>
          </div>
        `;
        return;
      }

      const q = quizState.questions[quizState.currentIdx];
      const total = quizState.questions.length;

      main.innerHTML = `
        <div class="space-y-3">
          <!-- 퀴즈 유형 선택기 -->
          <div class="grid grid-cols-2 gap-1.5 bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl">
            <button onclick="switchQuizType('choice')" class="py-1.5 rounded-lg text-xs font-extrabold transition ${
              quizState.type === 'choice'
                ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm'
                : 'text-slate-600 dark:text-slate-400'
            }">
              4지선다 영작 퀴즈
            </button>
            <button onclick="switchQuizType('order')" class="py-1.5 rounded-lg text-xs font-extrabold transition ${
              quizState.type === 'order'
                ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm'
                : 'text-slate-600 dark:text-slate-400'
            }">
              단어 블록 어순배열
            </button>
          </div>

          <!-- 문제 카드 -->
          <div class="bg-white dark:bg-slate-800 rounded-3xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400 mb-3">
              <span>문제 ${quizState.currentIdx + 1} / ${total}</span>
              <span class="flex items-center gap-1.5">
                ${(quizState.combo || 0) >= 2 ? `<span class="combo-pop px-1.5 py-0.5 rounded-md bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-300 text-[10px] font-extrabold">🔥 ${quizState.combo}연속</span>` : ''}
                <span class="text-indigo-600 dark:text-indigo-400">점수: ${quizState.score}</span>
              </span>
            </div>

            <span class="inline-block px-2.5 py-0.5 rounded-md text-[11px] font-extrabold bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 mb-2">
              ${q.tag}
            </span>
            <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white leading-snug mb-4">
              "${q.ko}"
            </h3>

            ${quizState.type === 'choice' ? renderChoiceQuizBody(q) : renderOrderQuizBody(q)}
          </div>
        </div>
      `;
    }

    function renderChoiceQuizBody(q) {
      return `
        <div class="space-y-2">
          ${quizState.options.map(opt => {
            let btnClass = 'bg-slate-50 dark:bg-slate-900/70 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100';
            if (quizState.answered) {
              if (opt.id === q.id) {
                btnClass = 'bg-emerald-50 dark:bg-emerald-950/70 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-extrabold';
              } else if (opt.id === quizState.selectedOption) {
                btnClass = 'bg-rose-50 dark:bg-rose-950/70 border-rose-500 text-rose-800 dark:text-rose-200';
              }
            }
            return `
              <button onclick="selectChoiceOption(${opt.id})" ${quizState.answered ? 'disabled' : ''}
                class="w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-en font-bold transition active:scale-95 ${btnClass}">
                ${opt.en}
              </button>
            `;
          }).join('')}
        </div>

        ${quizState.answered ? `
          <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between gap-2">
            <button onclick="playSingleTTS(${q.id})" class="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-extrabold">
              🔊 정답 발음 듣기
            </button>
            <button onclick="nextQuizQuestion()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold shadow-sm">
              다음 문제 ▶
            </button>
          </div>
        ` : ''}
      `;
    }

    function selectChoiceOption(optId) {
      if (quizState.answered) return;
      const q = quizState.questions[quizState.currentIdx];
      quizState.answered = true;
      quizState.selectedOption = optId;

      if (optId === q.id) {
        quizState.score++;
        quizState.combo = (quizState.combo || 0) + 1;
        celebrateCorrect();
      } else {
        quizState.combo = 0;
        quizState.wrongList.push(q);
      }
      markStudied(q.id);
      speakText(q.en, 0.95);
      renderQuizMode();
    }

    // 정답 축하: 기본은 토스트, 3연속 이상은 색종이까지
    function celebrateCorrect() {
      const combo = quizState.combo || 0;
      if (combo >= 3) {
        showCelebrate(`${combo}연속 정답! 🔥`, '🎉');
        burstConfetti(14);
      } else {
        showCelebrate(combo >= 2 ? `${combo}연속 정답!` : '정답!', '✅');
      }
    }

    function renderOrderQuizBody(q) {
      const isCorrect = quizState.answered && quizState.orderedWords.map(w => w.word).join(' ') === q.en;

      return `
        <!-- 조립 영역 -->
        <div class="min-h-[68px] p-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-dashed ${
          quizState.answered
            ? isCorrect ? 'border-emerald-500 bg-emerald-50/40' : 'border-rose-500 bg-rose-50/40'
            : 'border-indigo-300 dark:border-slate-600'
        } flex flex-wrap gap-1.5 items-center mb-3">
          ${quizState.orderedWords.length === 0
            ? `<span class="text-xs text-slate-400">아래 단어 블록을 순서대로 터치해 문장을 완성하세요</span>`
            : quizState.orderedWords.map((w, idx) => `
                <button onclick="removeOrderedWord(${idx})" ${quizState.answered ? 'disabled' : ''}
                  class="px-2.5 py-1.5 rounded-xl bg-indigo-600 text-white font-en text-xs font-extrabold shadow-sm active:scale-90">
                  ${w.word}
                </button>
              `).join('')
          }
        </div>

        <!-- 선택 가능한 단어 풀 -->
        <div class="flex flex-wrap gap-1.5 mb-4">
          ${quizState.availableWords.map((w, idx) => `
            <button onclick="pickAvailableWord(${idx})" ${quizState.answered ? 'disabled' : ''}
              class="px-3 py-2 rounded-xl bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 font-en text-xs font-bold shadow-sm active:scale-90">
              ${w.word}
            </button>
          `).join('')}
        </div>

        ${!quizState.answered ? `
          <button onclick="checkOrderAnswer()" ${quizState.orderedWords.length === 0 ? 'disabled' : ''}
            class="w-full py-3 rounded-2xl bg-indigo-600 disabled:opacity-40 text-white text-xs font-extrabold shadow-sm active:scale-95 transition">
            정답 확인하기
          </button>
        ` : `
          <div class="space-y-2.5">
            <div class="p-3 rounded-xl text-xs font-bold ${
              isCorrect
                ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300'
                : 'bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300'
            }">
              ${isCorrect ? '🎉 정답입니다!' : `❌ 정답: <span class="font-en font-extrabold">${q.en}</span>`}
            </div>
            <div class="flex justify-between gap-2">
              <button onclick="playSingleTTS(${q.id})" class="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-extrabold">
                🔊 발음 듣기
              </button>
              <button onclick="nextQuizQuestion()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">
                다음 문제 ▶
              </button>
            </div>
          </div>
        `}
      `;
    }

    function pickAvailableWord(idx) {
      const item = quizState.availableWords.splice(idx, 1)[0];
      quizState.orderedWords.push(item);
      renderQuizMode();
    }

    function removeOrderedWord(idx) {
      const item = quizState.orderedWords.splice(idx, 1)[0];
      quizState.availableWords.push(item);
      renderQuizMode();
    }

    function checkOrderAnswer() {
      const q = quizState.questions[quizState.currentIdx];
      const userSentence = quizState.orderedWords.map(w => w.word).join(' ');
      quizState.answered = true;
      if (userSentence === q.en) {
        quizState.score++;
        quizState.combo = (quizState.combo || 0) + 1;
        celebrateCorrect();
      } else {
        quizState.combo = 0;
        quizState.wrongList.push(q);
      }
      markStudied(q.id);
      speakText(q.en, 0.95);
      renderQuizMode();
    }

    function nextQuizQuestion() {
      if (quizState.currentIdx + 1 >= quizState.questions.length) {
        quizState.finished = true;
        const total = quizState.questions.length;
        const perfect = quizState.score === total;
        burstConfetti(perfect ? 40 : 24);
        showCelebrate(perfect ? `만점! ${total}문제 완벽해요` : `${total}문제 완료! ${quizState.score}문제 정답`, perfect ? '🏆' : '🏁');
      } else {
        quizState.currentIdx++;
        prepareCurrentQuestion();
      }
      renderQuizMode();
    }

    function retryWrongQuestions() {
      const wrongCopy = [...quizState.wrongList];
      initQuiz(wrongCopy);
    }

    // =========================================================================
    // 11. 빈 상태 UI 및 커스텀 모달
    // =========================================================================
    function renderEmptyState() {
      const hardEmpty = state.statusFilter === 'hard';
      return `
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 text-center border border-slate-200 dark:border-slate-700 my-4">
          <div class="text-3xl mb-2">🔍</div>
          <h3 class="text-sm font-extrabold text-slate-800 dark:text-white mb-1">조건에 맞는 문장이 없습니다</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">${hardEmpty
            ? '아직 Hard로 표시한 문장이 없어요. 카드의 🔥 Hard 버튼으로 어려운 문장을 모아 두면 여기서 바로 반복·퀴즈할 수 있어요.'
            : '검색어를 지우거나 필터를 [전체]로 변경해 보세요.'}</p>
          <button onclick="resetFilters()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">
            필터 초기화
          </button>
        </div>
      `;
    }

    function resetFilters() {
      state.category = 'all';
      state.statusFilter = 'all';
      state.searchQuery = '';
      state.currentPage = 1;
      document.getElementById('categorySelect').value = 'all';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderChapterPills();
      renderStatusFilterButtons();
      renderActiveMode();
    }

    function showModal(title, message, actionsHtml = null) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modalActions').innerHTML = actionsHtml || `
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">확인</button>
      `;
      document.getElementById('customModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('customModal').classList.add('hidden');
    }

    function openResetModal() {
      showModal(
        '학습 기록 초기화',
        `${TOTAL_SENTENCES}문장의 암기 완료 · 즐겨찾기 · Hard 표시 기록을 모두 초기화하시겠습니까?`,
        `
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-extrabold">취소</button>
          <button onclick="confirmFullReset()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">초기화</button>
        `
      );
    }

    function confirmFullReset() {
      stopRepeatPlayback();
      state.memorized = {};
      state.starred = {};
      state.difficult = {};
      state.currentPage = 1;
      state.flashIndex = 0;
      saveAppState();
      updateDashboardStats();
      renderActiveMode();
      closeModal();
    }

    // =========================================================================
    // 12. 앱 초기화 실행
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadAppState();
      renderCategoryOptions();
      document.getElementById('categorySelect').value = state.category;
      updateDashboardStats();
      renderModeTabs();
      renderChapterPills();
      renderStatusFilterButtons();
      renderAccentPills();
      renderSpeedPills();
      renderVoiceOptions();
      updateMissionUI();

      if (state.mode === 'quiz') initQuiz();
      else renderActiveMode();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => renderVoiceOptions();
        // 일부 기기는 음성 목록을 늦게 채우기 때문에 한 번 더 확인
        setTimeout(renderVoiceOptions, 500);
        setTimeout(renderVoiceOptions, 1500);
      }
    });
  </script>
</body>
</html>
